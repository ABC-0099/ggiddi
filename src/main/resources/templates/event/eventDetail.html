<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${event.title}">
        이벤트 상세
    </title>

    <link rel="stylesheet" th:href="@{/css/event/eventDetail.css}">
</head>


<body>


<!-- 네비게이션 -->
<div th:replace="~{layout/navbar :: navbar(currentMenu='event')}"></div>



<main class="event-page">


    <section class="event-detail">


        <!-- 제목 -->
        <h1 class="event-title"
            th:text="${event.title}">
        </h1>



        <!-- 기간 -->
        <div class="event-date">

            📅

            <span th:text="${event.startDate}"></span>

            ~

            <span th:text="${event.endDate}"></span>

        </div>




        <!-- 포스터 -->
        <img
                th:src="${event.poster}"
                class="event-poster"
                alt="이벤트 이미지">




        <!-- 이벤트 내용 -->
        <div class="event-content"
             th:utext="${event.content}">
        </div>





        <!-- 이벤트 참여 버튼 (진행중일 때만 노출) -->
        <div class="participate-wrap" th:if="${event.status == 'ONGOING'}">

            <button class="participate-btn"
                    onclick="openModal()">

                이벤트 참여하기

            </button>

        </div>





    </section>


</main>

<!-- 이벤트 참여 모달 -->

<div class="modal-overlay"
     id="eventModal">

    <div class="event-modal">

        <!-- 모달 헤더 -->

        <div class="modal-header">


            <div class="modal-title">

                📝 이벤트 참여하기

            </div>

            <button class="close-btn"
                    onclick="closeModal()">

                ×

            </button>


        </div>

        <!-- 모달 내용 -->

        <div class="modal-body">

            <label class="input-label">

                참여자
                <span class="optional-label">(로그인 계정)</span>

            </label>

            <input
                    type="text"
                    id="participantName"
                    class="modal-input"
                    th:value="${#authentication != null and #authentication.name != 'anonymousUser'} ? ${#authentication.name} : ''"
                    readonly>

            <label class="input-label">

                영상 첨부
                <span class="optional-label">(선택)</span>

            </label>
            <input
                    type="file"
                    id="participantFile"
                    class="modal-input"
                    accept="video/*">

            <label class="input-label">

                이벤트

            </label>

            <div class="event-preview"
                 th:text="${event.title}">

            </div>

        </div>

        <!-- 모달 하단 버튼 -->

        <div class="modal-footer">


            <button type="button" class="submit-btn" id="participateSubmitBtn" onclick="submitParticipation()">

                참여하기

            </button>


        </div>


    </div>

</div>


<!-- 푸터 -->

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/drag-translate :: dragTranslate}"></div>

<script>


    function openModal(){

        document.getElementById("eventModal").style.display = "flex";

    }



    function closeModal(){

        document.getElementById("eventModal").style.display = "none";

    }




    window.onclick = function(e){


        const modal =
            document.getElementById("eventModal");



        if(e.target === modal){

            modal.style.display = "none";

        }


    }


    // 참여하기 버튼 - 실제 전송 API가 아직 없어서, 전송되는 것처럼 흉내만 냄
    // (백엔드 연동 시 여기 setTimeout 부분을 fetch(...)로 교체하면 됨)
    function submitParticipation() {

        const nameInput = document.getElementById("participantName");
        const fileInput = document.getElementById("participantFile");
        const btn = document.getElementById("participateSubmitBtn");

        if (!nameInput.value.trim()) {
            alert("로그인 후 참여할 수 있어요.");
            window.location.href = "/login";
            return;
        }

        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = "전송 중...";

        // 실제 서버 전송 대신 잠깐 딜레이 후 완료 처리
        setTimeout(() => {
            alert("이벤트 참여가 접수되었습니다! 🎉");

            fileInput.value = "";
            btn.disabled = false;
            btn.textContent = originalText;

            closeModal();
        }, 700);
    }



</script>

</body>
</html>
