<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이벤트</title>

    <link rel="stylesheet" th:href="@{/css/event/event.css}">
</head>
<body>

<div th:replace="~{layout/navbar :: navbar(currentMenu='event')}"></div>


<!-- 배너 -->
<section class="banner">

    <div class="banner-slide active">
        <img th:src="@{/images/banner1.png}" class="banner-image">

        <button class="arrow-btn prev-btn">&lt;</button>
        <button class="arrow-btn next-btn">&gt;</button>

        <div class="banner-controls">
            <div class="banner-dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </div>
    </div>

    <div class="banner-slide">
        <img th:src="@{/images/banner2.png}" class="banner-image">

        <button class="arrow-btn prev-btn">&lt;</button>
        <button class="arrow-btn next-btn">&gt;</button>

        <div class="banner-controls">
            <div class="banner-dots">
                <span class="dot" data-index="0"></span>
                <span class="dot active" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </div>
    </div>

    <div class="banner-slide">
        <img th:src="@{/images/banner3.png}" class="banner-image">

        <button class="arrow-btn prev-btn">&lt;</button>
        <button class="arrow-btn next-btn">&gt;</button>

        <div class="banner-controls">
            <div class="banner-dots">
                <span class="dot" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot active" data-index="2"></span>
            </div>
        </div>
    </div>

</section>

<!-- 이벤트 -->
<section class="event-section">

    <h1 class="event-title">이벤트</h1>

    <div class="event-grid">

        <a th:each="event : ${events}"
           th:href="@{/event/{id}(id=${event.id})}"
           class="event-link">

            <div class="event-card">

                <img th:src="${event.thumbnail}" alt="썸네일">

                <h3 th:text="${event.title}"></h3>

                <p>
                    기간 :
                    <span th:text="${event.startDate}"></span>
                    ~
                    <span th:text="${event.endDate}"></span>
                </p>

                <p>
                    참여자 :
                    <span th:text="${event.participantCount}"></span>명
                </p>

                <button
                        th:classappend="${event.status == 'ONGOING'} ? 'progress-btn' : 'result-btn'"
                        th:text="${event.status == 'ONGOING'} ? '진행중' :
                             (${event.status == 'UPCOMING'} ? '예정' : '발표 확인')">
                </button>

            </div>

        </a>

    </div>

    <div class="pagination">1</div>

</section>

<script th:src="@{/js/event.js}"></script>

<script>
    // 배너 슬라이드 + 점(dot) 인디케이터 로직
    (function () {
        const slides = document.querySelectorAll('.banner-slide');
        let current = 0;

        function showSlide(index) {
            if (index < 0) index = slides.length - 1;
            if (index >= slides.length) index = 0;

            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);

                slide.querySelectorAll('.dot').forEach(dot => {
                    dot.classList.toggle('active', Number(dot.dataset.index) === index);
                });
            });

            current = index;
        }

        document.querySelectorAll('.next-btn').forEach(btn => {
            btn.addEventListener('click', () => showSlide(current + 1));
        });

        document.querySelectorAll('.prev-btn').forEach(btn => {
            btn.addEventListener('click', () => showSlide(current - 1));
        });

        document.querySelectorAll('.dot').forEach(dot => {
            dot.addEventListener('click', () => showSlide(Number(dot.dataset.index)));
        });
    })();
</script>

</body>
</html>
