<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없어요</title>
  <style>
    :root {
      --navy: #1b2b4b;
      --navy-dark: #14213b;
      --teal: #21b892;
      --teal-light: #e4f7f1;
      --gray-text: #7c8592;
      --gray-light: #98a0ab;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, #eef8f4 0%, #f7fbf9 45%, #ffffff 100%);
      color: var(--navy);
      padding: 40px 20px;
    }

    .page {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 2px 10px rgba(27, 43, 75, 0.06);
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 36px;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      display: inline-block;
    }

    .code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 110px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .code .ring {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 14px solid var(--teal);
      display: inline-block;
    }

    .caption {
      font-size: 15px;
      color: var(--gray-light);
      margin-bottom: 44px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    h1 .accent {
      color: var(--teal);
    }

    .desc {
      font-size: 15px;
      line-height: 1.7;
      color: var(--gray-text);
      margin-bottom: 44px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 15px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--navy-dark);
      color: #ffffff;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--navy);
      border: 1px solid #dfe3ea;
    }

    @media (max-width: 480px) {
      .code {
        font-size: 78px;
      }
      .code .ring {
        width: 54px;
        height: 54px;
        border-width: 10px;
      }
      h1 {
        font-size: 22px;
      }
      .actions {
        flex-direction: column;
      }
      .btn {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="page">
  <span class="badge">페이지 오류</span>

  <div class="code" aria-hidden="true">
    <span>4</span><span class="ring"></span><span>4</span>
  </div>
  <p class="caption">0 대신 ㅇ이 앉아있어요</p>

  <h1>이런, <span class="accent">길을 잃으셨네요</span><br>찾으시는 페이지가 없어요</h1>

  <p class="desc">
    주소가 바뀌었거나 삭제된 페이지예요.<br>
    아래 버튼으로 학습을 이어가 보세요.
  </p>

  <div class="actions">
    <a href="/" class="btn btn-primary">홈으로 가기 →</a>
    <a href="javascript:history.back()" class="btn btn-secondary">이전 페이지로</a>
  </div>
</div>
</body>
</html>
