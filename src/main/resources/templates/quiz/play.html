<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${quizTitle} + ' — 끼역띠귿'">퀴즈 풀기 — 끼역띠귿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/layout/navbar.css}" />
  <link rel="stylesheet" th:href="@{/css/layout/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/quiz/play.css}" />
</head>
<body>

<div class="bg-orbs"><div class="orb o1"></div><div class="orb o2"></div></div>

<div th:replace="~{layout/navbar :: navbar(currentMenu='practiceQuiz')}"></div>

<script th:inline="javascript">
  const QUIZ_ID = /*[[${quizId}]]*/ 0;
  const CSRF_HEADER = 'X-XSRF-TOKEN';
</script>

<main class="play-wrap">

  <!-- 상단 헤더 바 -->
  <div class="play-header">
    <div class="play-header-inner">
      <div class="ph-left">
        <a th:href="@{/quiz}" class="ph-back">← 퀴즈 목록</a>
        <div class="ph-info">
          <span class="ph-type-badge badge-practice">연습 퀴즈</span>
          <span class="ph-title" th:text="${quizTitle}">퀴즈 제목</span>
        </div>
      </div>
      <div class="ph-right">
        <div class="ph-progress-wrap">
          <span id="progress-text" class="ph-progress-text">- / -</span>
          <div class="ph-progress-track">
            <div class="ph-progress-bar" id="progress-bar" style="width:0%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 로딩 -->
  <div class="play-body" id="loadingArea">
    <div class="question-card" style="text-align:center; color:var(--ink-faint);">
      문제를 불러오는 중...
    </div>
  </div>

  <!-- 퀴즈 본문 -->
  <div class="play-body" id="playBody" style="display:none;">

    <!-- 문제 카드 -->
    <div class="question-card" id="question-card">
      <div class="qc-top">
        <span class="qc-num" id="qc-num">Q1</span>
        <span class="qc-type-badge" id="qc-type-badge" style="display:none;"></span>
        <span class="qc-stage" th:text="${contentTitle}">1강</span>
      </div>
      <div class="qc-text" id="qc-text">문제 내용이 여기에 표시됩니다.</div>

      <!-- 보기 -->
      <div class="qc-options" id="qc-options"></div>

      <!-- 피드백 -->
      <div class="qc-feedback" id="qc-feedback" style="display:none;"></div>

      <!-- 버튼 -->
      <div class="qc-actions">
        <button class="qc-btn-submit" id="btn-submit" onclick="submitAnswer()" disabled>확인</button>
        <button class="qc-btn-next"  id="btn-next"   onclick="nextQuestion()" style="display:none;">다음 →</button>
      </div>
    </div>

    <!-- 결과 카드 (퀴즈 끝나면 표시) -->
    <div class="result-card" id="result-card" style="display:none;">
      <div class="rc-emoji" id="rc-emoji">🎉</div>
      <div class="rc-score" id="rc-score">10 / 10</div>
      <div class="rc-label" id="rc-label">훌륭해요!</div>

      <!-- 문항별 결과 그리드 -->
      <div class="rc-cells" id="rc-cells"></div>

      <div class="rc-actions">
        <a th:href="@{/quiz}" class="rc-btn-list">← 목록으로</a>
        <button class="rc-btn-retry" onclick="location.reload()">🔄 다시 풀기</button>
      </div>
    </div>

  </div>

</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/drag-translate :: dragTranslate}"></div>
<script>
  // ── 상태 ──
  let questions   = [];
  let currentIdx  = 0;
  let selectedOpt = null; // 0-based index (화면 표시용)
  let answered    = false;
  let score       = 0;
  let results     = []; // {correct}

  function getCsrfToken() {
    const match = document.cookie.match(/(^|;\s*)XSRF-TOKEN=([^;]*)/);
    return match ? decodeURIComponent(match[2]) : '';
  }

  // ── 퀴즈 시작 (문제은행에서 서버가 랜덤으로 뽑아줌) ──
  function startQuiz() {
    fetch('/api/quiz/' + QUIZ_ID + '/start')
      .then(res => {
        if (!res.ok) throw new Error('시작 실패');
        return res.json();
      })
      .then(data => {
        questions = data.questions;
        document.getElementById('loadingArea').style.display = 'none';
        document.getElementById('playBody').style.display = '';
        renderQuestion();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loadingArea').innerHTML =
          '<div class="question-card" style="text-align:center; color:var(--red);">문제를 불러오지 못했어요. 잠금 상태이거나 오류가 발생했어요.</div>';
      });
  }

  // ── 문제 렌더 ──
  function renderQuestion() {
    const q = questions[currentIdx];
    const letters = ['A', 'B', 'C', 'D'];

    document.getElementById('qc-num').textContent = 'Q' + (currentIdx + 1);

    const typeBadge = document.getElementById('qc-type-badge');
    if (q.questionType) {
      typeBadge.textContent = q.questionType;
      typeBadge.style.display = '';
    } else {
      typeBadge.style.display = 'none';
    }

    document.getElementById('qc-text').textContent = q.question;

    const opts = document.getElementById('qc-options');
    opts.innerHTML = q.options.map((o, i) =>
      `<div class="qc-opt" data-idx="${i}" onclick="selectOpt(this)">
        <span class="qc-letter">${letters[i]}</span>
        <span>${o}</span>
      </div>`
    ).join('');

    const fb = document.getElementById('qc-feedback');
    fb.style.display = 'none'; fb.className = 'qc-feedback'; fb.textContent = '';

    document.getElementById('btn-submit').disabled = true;
    document.getElementById('btn-submit').style.display = '';
    document.getElementById('btn-next').style.display = 'none';

    document.getElementById('btn-next').textContent =
      currentIdx === questions.length - 1 ? '결과 보기 →' : '다음 →';

    const pct = ((currentIdx + 1) / questions.length) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = (currentIdx + 1) + ' / ' + questions.length;

    selectedOpt = null;
    answered = false;
  }

  function selectOpt(el) {
    if (answered) return;
    document.querySelectorAll('.qc-opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedOpt = parseInt(el.dataset.idx, 10);
    document.getElementById('btn-submit').disabled = false;
  }

  // ── 문항 하나 채점 (서버에 물어봄 - 정답은 클라이언트에 안 심어둠) ──
  function submitAnswer() {
    if (selectedOpt === null || answered) return;
    answered = true;

    const q = questions[currentIdx];
    const selectedOption = selectedOpt + 1; // 1~4로 변환

    fetch('/api/quiz/question/' + q.id + '/check', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        [CSRF_HEADER]: getCsrfToken()
      },
      body: JSON.stringify({ selectedOption })
    })
      .then(res => res.json())
      .then(result => renderFeedback(result))
      .catch(err => {
        console.error(err);
        alert('채점 중 오류가 발생했어요.');
        answered = false;
      });
  }

  function renderFeedback(result) {
    const opts = document.querySelectorAll('.qc-opt');
    const fb = document.getElementById('qc-feedback');

    opts[selectedOpt].classList.remove('selected');
    opts[selectedOpt].classList.add(result.correct ? 'correct' : 'wrong');
    if (!result.correct && result.correctAnswer) {
      opts[result.correctAnswer - 1].classList.add('correct');
    }

    fb.textContent = result.explanation || (result.correct ? '정답이에요!' : '아쉬워요, 다시 확인해봐요.');
    fb.className = 'qc-feedback ' + (result.correct ? 'fb-correct' : 'fb-wrong');
    fb.style.display = 'block';

    if (result.correct) score++;
    results.push({ correct: result.correct });

    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-next').style.display = '';
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx >= questions.length) showResult();
    else renderQuestion();
  }

  // ── 결과 ──
  function showResult() {
    document.getElementById('question-card').style.display = 'none';
    document.getElementById('result-card').style.display = '';

    const total = questions.length;
    const pct = Math.round((score / total) * 100);

    document.getElementById('rc-emoji').textContent = pct >= 80 ? '🎉' : pct >= 60 ? '🙂' : '😅';
    document.getElementById('rc-score').textContent = score + ' / ' + total + '  (' + pct + '점)';
    document.getElementById('rc-label').textContent =
      pct >= 80 ? '훌륭해요! 실력이 많이 늘었어요.' :
      pct >= 60 ? '잘 하셨어요! 조금만 더 연습해봐요.' : '틀린 문제를 복습하고 다시 도전해보세요!';

    document.getElementById('rc-cells').innerHTML = results.map((r, i) =>
      `<div class="rc-cell ${r.correct ? 'ok' : 'no'}">${i + 1}</div>`
    ).join('');

    saveFinish(score, total);
  }

  function saveFinish(score, total) {
    fetch('/api/quiz/' + QUIZ_ID + '/finish', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        [CSRF_HEADER]: getCsrfToken()
      },
      body: JSON.stringify({ score, total })
    }).catch(e => console.warn('결과 저장 실패:', e));
  }

  // ── 초기 실행 ──
  startQuiz();
</script>

</body>
</html>
