<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>끼역띠귿 — 공지사항 작성</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" th:href="@{/css/layout/navbar.css}" />
  <link rel="stylesheet" th:href="@{/css/layout/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/notice/form.css}" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

<div class="bg-orbs"><div class="orb o1"></div><div class="orb o2"></div></div>

<!-- NAV -->
<div th:replace="~{layout/navbar :: navbar(currentMenu='quiz')}"></div>

<div class="form-wrap">

  <!-- 뒤로가기 -->
  <a th:href="@{/notice/list}" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    공지사항 목록
  </a>

  <form class="form-card" id="noticeForm"
        th:action="@{/notice/save}"
        th:object="${noticeDTO}" method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="form-header">
      <h1>공지사항 작성</h1>
      <p>새로운 공지사항을 등록합니다.</p>
    </div>

    <div class="form-body">

      <!-- 카테고리 -->
      <div class="form-group">
        <label class="form-label" for="category">카테고리<span class="req">*</span></label>
        <select class="form-select" id="category" th:field="*{category}">
          <option value="notice">공지</option>
          <option value="event">이벤트</option>
          <option value="system">시스템</option>
          <option value="update">업데이트</option>
        </select>
      </div>

      <!-- 제목 -->
      <div class="form-group">
        <label class="form-label" for="title">제목<span class="req">*</span></label>
        <input class="form-input" type="text" id="title" th:field="*{title}" placeholder="제목을 입력하세요" required />
      </div>

      <!-- 본문 -->
      <div class="form-group">
        <label class="form-label" for="content">내용<span class="req">*</span></label>
        <textarea class="form-textarea" id="content" th:field="*{content}" placeholder="내용을 입력하세요" required></textarea>
      </div>

    </div>

    <div class="form-actions">
      <a th:href="@{/notice/list}" class="btn btn-cancel">취소</a>
      <button type="submit" class="btn btn-primary">등록</button>
    </div>

  </form>

</div>

<!-- FOOTER -->
<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
