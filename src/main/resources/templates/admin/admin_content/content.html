<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 콘텐츠 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/content.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">콘텐츠 관리</div>
                <div class="section-subtitle" th:text="|전체 ${totalContentCount}개 콘텐츠|">전체 0개 콘텐츠</div>
            </div>
            <div class="section-actions">
                <a class="btn btn-primary" th:href="@{/admin/content/create}">
                    <i class="ti ti-plus"></i>
                    콘텐츠 추가
                </a>
            </div>
        </div>

        <div class="card">
            <table class="data-table">
                <thead>
                <tr>
                    <th style="width:40px">#</th>
                    <th>카테고리</th>
                    <th>콘텐츠</th>
                    <th>단계</th>
                    <th>무료여부</th>
                    <th>상태</th>
                    <th>등록일</th>
                    <th style="width:80px; text-align:center;">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(contents)}">
                    <td colspan="8" style="text-align: center; color: var(--gray-400); padding: 50px 0;">
                        등록된 콘텐츠가 없습니다. '콘텐츠 추가' 버튼을 눌러 첫 데이터를 등록해 보세요!
                    </td>
                </tr>
                <tr th:each="c, loop : ${contents}">
                    <td style="color:var(--gray-400)" th:text="${loop.count}">1</td>
                    <td th:text="${c.category != null ? c.category.title : '미지정'}">카테고리</td>
                    <td>
                        <div class="content-title-cell">
                            <div class="content-thumb"><i class="ti ti-video"></i></div>
                            <div class="content-name" th:text="${c.title}">제목</div>
                        </div>
                    </td>
                    <td th:text="${c.stage != null ? c.stage : '-'}">1</td>
                    <td>
                        <span class="badge badge-success" th:if="${c.free}">무료</span>
                        <span class="badge badge-gray" th:unless="${c.free}">유료</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${c.status == 'PUBLISHED' ? 'badge-success' : (c.status == 'SCHEDULED' ? 'badge-info' : 'badge-gray')}"
                              th:text="${c.status == 'PUBLISHED' ? '공개' : (c.status == 'SCHEDULED' ? '예약공개' : '임시저장')}">임시저장</span>
                    </td>
                    <td th:text="${c.createdDate != null ? #temporals.format(c.createdDate, 'yyyy-MM-dd') : '-'}">-</td>
                    <td style="text-align:center;">
                        <div class="action-buttons-cell">
                            <a class="btn-action-icon btn-action-edit" title="수정" th:href="@{|/admin/content/edit/${c.id}|}">
                                <i class="ti ti-edit"></i>
                            </a>
                            <a th:href="@{|/admin/content/delete/${c.id}|}" class="btn-action-icon btn-action-delete" title="삭제"
                               onclick="return confirm('이 콘텐츠를 정말 삭제하시겠습니까? 관련 파일도 함께 제거됩니다.');">
                                <i class="ti ti-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
