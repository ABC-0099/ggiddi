<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 콘텐츠 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/content-form.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">콘텐츠 수정</div>
                <div class="section-subtitle" th:text="${existingContent.title}">콘텐츠 제목</div>
            </div>
            <div class="section-actions">
                <a class="btn btn-outline" th:href="@{/admin/content}">목록으로</a>
            </div>
        </div>

        <form th:action="@{|/admin/content/update/${contentDTO.id}|}"
              th:object="${contentDTO}"
              method="post"
              enctype="multipart/form-data">

            <!-- 기본 정보 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title"><i class="ti ti-info-circle"></i>기본 정보</div>
                </div>
                <div class="content-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>카테고리(강좌)</label>
                            <select th:field="*{categoryId}" class="form-select">
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.title} + ' (' + ${cat.instructor} + ')'">카테고리명</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>영상 순서(sequence)</label>
                            <input type="number" th:field="*{sequence}" class="form-input" min="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>콘텐츠 제목 <span class="required">*</span></label>
                        <input type="text" th:field="*{title}" class="form-input" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>학습 단계</label>
                            <select th:field="*{stage}" class="form-select">
                                <option value="1">1단계 - 음절</option>
                                <option value="2">2단계 - 단어</option>
                                <option value="3">3단계 - 문장</option>
                                <option value="4">4단계 - 일상회화</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>공개 상태</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="DRAFT">임시저장</option>
                                <option value="PUBLISHED">공개</option>
                                <option value="SCHEDULED">예약공개</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>예약 공개 일시</label>
                            <input type="datetime-local" th:field="*{publishAt}" class="form-input">
                        </div>
                        <div class="form-group">
                            <div class="form-checkbox-row" style="margin-top:38px;">
                                <input type="checkbox" id="free" th:field="*{free}">
                                <label for="free" style="margin:0;">무료 콘텐츠로 공개</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>영상 설명</label>
                        <textarea th:field="*{description}" class="form-textarea"></textarea>
                    </div>

                    <div class="form-group">
                        <label>키워드 (검색용, 쉼표로 구분)</label>
                        <input type="text" th:field="*{keywords}" class="form-input">
                    </div>

                    <div class="form-group">
                        <label>외부 영상 URL</label>
                        <input type="text" th:field="*{videoUrl}" class="form-input">
                    </div>
                </div>
            </div>

            <!-- 파일 교체 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title"><i class="ti ti-upload"></i>파일 교체 (선택)</div>
                </div>
                <div class="content-form">
                    <div class="form-group">
                        <label>강의 영상 파일</label>
                        <span class="file-current" th:if="${existingContent.fileOrigin != null}" th:text="'현재: ' + ${existingContent.fileOrigin}">현재 파일</span>
                        <div class="file-upload-box">
                            <i class="ti ti-video"></i>
                            <input type="file" name="videoFile" accept="video/*">
                            <p>새 파일을 선택하면 기존 영상을 교체합니다. 유지하려면 비워두세요.</p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>썸네일 이미지</label>
                        <span class="file-current" th:if="${existingContent.thumbFileName != null}" th:text="'현재: ' + ${existingContent.thumbFileName}">현재 파일</span>
                        <div class="file-upload-box">
                            <i class="ti ti-photo"></i>
                            <input type="file" name="thumbFile" accept="image/*">
                            <p>새 파일을 선택하면 기존 썸네일을 교체합니다.</p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>첨부파일</label>
                        <span class="file-current" th:if="${existingContent.attachFileOrigin != null}" th:text="'현재: ' + ${existingContent.attachFileOrigin}">현재 파일</span>
                        <div class="file-upload-box">
                            <i class="ti ti-paperclip"></i>
                            <input type="file" name="attachFile">
                            <p>새 파일을 선택하면 기존 첨부파일을 교체합니다.</p>
                        </div>
                        <div class="form-checkbox-row" th:if="${existingContent.attachFileOrigin != null}">
                            <input type="checkbox" id="deleteAttach" th:field="*{deleteAttach}">
                            <label for="deleteAttach" style="margin:0;">기존 첨부파일 삭제</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="form-btn-wrap">
                    <a class="btn btn-outline" th:href="@{/admin/content}">취소</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="ti ti-device-floppy"></i>
                        변경사항 저장
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
