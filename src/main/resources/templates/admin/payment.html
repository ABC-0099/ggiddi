<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 결제/수강 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/payment.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">결제/수강 관리</div>
                <div class="section-subtitle" th:text="|전체 ${totalOrderCount}건|">전체 0건</div>
            </div>
        </div>

        <div class="pay-kpi">
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-navy"><i class="ti ti-receipt"></i></div>
                <div class="kpi-label">전체 결제건수</div>
                <div class="kpi-value" th:text="${totalOrderCount}">0</div>
                <div class="kpi-accent accent-navy"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-mint"><i class="ti ti-cash"></i></div>
                <div class="kpi-label">총 매출 (성공건 기준)</div>
                <div class="kpi-value" th:text="|₩${#numbers.formatInteger(totalRevenue, 0, 'COMMA')}|">₩0</div>
                <div class="kpi-accent accent-mint"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-amber"><i class="ti ti-clock-x"></i></div>
                <div class="kpi-label">결제 취소</div>
                <div class="kpi-value" th:text="${cancelCount}">0</div>
                <div class="kpi-accent accent-amber"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-coral"><i class="ti ti-alert-triangle"></i></div>
                <div class="kpi-label">결제 실패</div>
                <div class="kpi-value" th:text="${failedCount}">0</div>
                <div class="kpi-accent accent-coral"></div>
            </div>
        </div>

        <div class="card">
            <table class="data-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th>구매자</th>
                    <th>카테고리</th>
                    <th>강사</th>
                    <th>결제금액</th>
                    <th>결제수단</th>
                    <th>결제일</th>
                    <th style="text-align:center">상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(orders.content)}">
                    <td colspan="8" style="text-align: center; color: var(--gray-400); padding: 50px 0;">
                        결제 내역이 없습니다.
                    </td>
                </tr>
                <tr th:each="order : ${orders.content}">
                    <td th:text="${order.id}">1</td>
                    <td th:text="${order.siteUser != null ? order.siteUser.username : '알 수 없음'}">구매자</td>
                    <td th:text="${order.category != null ? order.category.title : '-'}">카테고리</td>
                    <td th:text="${order.instructorName} ?: '-'">강사명</td>
                    <td th:text="|₩${order.price}|">₩0</td>
                    <td th:text="${order.payType} ?: '-'">카드</td>
                    <td th:text="${order.payday != null ? #temporals.format(order.payday, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td style="text-align:center">
                        <span class="badge badge-success" th:if="${order.status != null and order.status.name() == 'SUCCESS'}">성공</span>
                        <span class="badge badge-gray" th:if="${order.status != null and order.status.name() == 'CANCEL'}">취소</span>
                        <span class="badge badge-danger" th:if="${order.status != null and order.status.name() == 'FAILED'}">실패</span>
                        <span class="badge badge-pending" th:if="${order.status == null}">대기</span>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- 페이지네이션 -->
            <div class="pagination">

                <!-- 이전 -->
                <a class="page-btn"
                   th:href="@{/admin/payment(page=${startPage-1})}"
                   th:classappend="${startPage == 0} ? ' disabled'">
                    &lt;
                </a>

                <!-- 페이지 번호 -->
                <a class="page-btn"
                   th:each="pageNum : ${#numbers.sequence(startPage,endPage)}"
                   th:href="@{/admin/payment(page=${pageNum})}"
                   th:text="${pageNum+1}"
                   th:classappend="${pageNum==orders.number}? ' active'">
                </a>

                <!-- 다음 -->
                <a class="page-btn"
                   th:href="@{/admin/payment(page=${endPage+1})}"
                   th:classappend="${endPage >= orders.totalPages-1}? ' disabled'">
                    &gt;
                </a>
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
