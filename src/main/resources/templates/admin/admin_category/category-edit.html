<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 카테고리 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/content-form.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">카테고리 수정</div>
                <div class="section-subtitle" th:text="${existingCategory.title}">강좌명</div>
            </div>
            <div class="section-actions">
                <a class="btn btn-outline" th:href="@{/admin/category}">목록으로</a>
            </div>
        </div>

        <form th:action="@{|/admin/category/update/${categoryDTO.id}|}"
              th:object="${categoryDTO}"
              method="post"
              enctype="multipart/form-data">

            <div class="card">
                <div class="card-head">
                    <div class="card-title"><i class="ti ti-info-circle"></i>강좌 정보</div>
                </div>
                <div class="content-form">
                    <div class="form-group">
                        <label>강좌명 <span class="required">*</span></label>
                        <input type="text" th:field="*{title}" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>강사명</label>
                        <input type="text" th:field="*{instructor}" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>강좌 설명</label>
                        <textarea th:field="*{description}" class="form-textarea"></textarea>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <div class="card-title"><i class="ti ti-upload"></i>강좌 대표 이미지</div>
                </div>
                <div class="content-form">
                    <div class="form-group">
                        <span class="file-current" th:if="${existingCategory.fileName != null}" th:text="'현재 파일: ' + ${existingCategory.fileName}">현재 파일</span>
                        <div class="file-upload-box">
                            <i class="ti ti-photo"></i>
                            <input type="file" name="attachFile" accept="image/*">
                            <p>새 이미지를 선택하면 기존 이미지를 교체합니다. 유지하려면 비워두세요.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="form-btn-wrap">
                    <a class="btn btn-outline" th:href="@{/admin/category}">취소</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="ti ti-device-floppy"></i>
                        변경사항 저장
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
