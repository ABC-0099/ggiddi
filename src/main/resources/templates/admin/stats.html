<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 통계 대시보드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/stats.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">통계 대시보드</div>
                <div class="section-subtitle">실시간 백엔드 데이터 연동</div>
            </div>
        </div>

        <!-- KPI -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-navy"><i class="ti ti-users"></i></div>
                <div class="kpi-label">전체 회원</div>
                <div class="kpi-value" th:text="${totalUserCount}">0</div>
                <div class="kpi-accent accent-navy"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-mint"><i class="ti ti-cash"></i></div>
                <div class="kpi-label">이번 달 매출</div>
                <div class="kpi-value" th:text="|₩${#numbers.formatInteger(monthlyRevenue, 0, 'COMMA')}|">₩0</div>
                <div class="kpi-accent accent-mint"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-amber"><i class="ti ti-user-plus"></i></div>
                <div class="kpi-label">이번 달 신규가입</div>
                <div class="kpi-value" th:text="${newSignupsThisMonth}">0</div>
                <div class="kpi-accent accent-amber"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-coral"><i class="ti ti-video"></i></div>
                <div class="kpi-label">전체 콘텐츠</div>
                <div class="kpi-value" th:text="${totalContentCount}">0</div>
                <div class="kpi-accent accent-coral"></div>
            </div>
        </div>

        <!-- CHART ROW -->
        <div class="chart-row">
            <div class="card">
                <div class="card-head">
                    <div>
                        <div class="card-title">월별 신규 회원 추이</div>
                        <div class="card-subtitle">최근 6개월</div>
                    </div>
                    <span class="badge badge-info" th:text="|누적 ${cumulativeUserCount}명|">누적 0명</span>
                </div>
                <div class="card-body">
                    <div class="bar-chart-wrap">
                        <div class="bar-group" th:each="m : ${monthlyStats}">
                            <div class="bar-fill"
                                 th:style="|height:${m.heightPx}px; background:${m.color};|"
                                 th:title="${m.count} + '명'"></div>
                            <span class="bar-lbl" th:text="${m.label}">1월</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <div>
                        <div class="card-title">플랜별 결제 비율</div>
                        <div class="card-subtitle">성공한 결제 기준</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="donut-section" th:if="${donutGradient != null}">
                        <div class="donut-visual" th:style="|background:${donutGradient};|"></div>
                        <div class="legend-list">
                            <div class="legend-item" th:each="c : ${categoryStats}">
                                <div class="legend-dot" th:style="|background:${c.color};|"></div>
                                <span th:text="${c.label}">카테고리</span>
                                <span class="legend-pct" th:text="|${c.percent}%|">0%</span>
                            </div>
                        </div>
                    </div>
                    <div th:if="${donutGradient == null}" style="text-align:center; color: var(--gray-400); padding: 30px 0;">
                        아직 성공한 결제 데이터가 없습니다.
                    </div>
                </div>
            </div>
        </div>

        <!-- RECENT PAYMENT -->
        <div class="card">
            <div class="card-head">
                <div class="card-title">최근 결제 내역</div>
                <a th:href="@{/admin/payment}" style="font-size:12px; color:var(--navy); text-decoration:none;">전체 보기 →</a>
            </div>
            <table class="data-table">
                <thead>
                <tr>
                    <th>회원명</th>
                    <th>플랜</th>
                    <th>결제 금액</th>
                    <th>결제 일시</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(recentPayments)}">
                    <td colspan="5" style="text-align:center; color: var(--gray-400); padding: 30px 0;">
                        최근 결제 내역이 없습니다.
                    </td>
                </tr>
                <tr th:each="p : ${recentPayments}">
                    <td th:text="${p.siteUser != null ? p.siteUser.username : '알 수 없음'}">회원명</td>
                    <td th:switch="${p.planType}">
                        <span th:case="'월구독'">월 구독</span>
                        <span th:case="'연구독'">연 구독</span>
                        <span th:case="'평생'">평생 소장</span>
                        <span th:case="null">개별 구매</span>
                        <span th:case="*" th:text="${p.planType}">-</span>
                    </td>
                    <td th:text="|₩${p.price}|">₩0</td>
                    <td th:text="${#temporals.format(p.payday, 'yyyy-MM-dd HH:mm')}">-</td>
                    <td>
                        <span class="badge badge-success" th:if="${p.status != null and p.status.name() == 'SUCCESS'}">성공</span>
                        <span class="badge badge-gray" th:if="${p.status != null and p.status.name() == 'CANCEL'}">취소</span>
                        <span class="badge badge-danger" th:if="${p.status != null and p.status.name() == 'FAILED'}">실패</span>
                        <span class="badge badge-pending" th:if="${p.status == null}">대기</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
