<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 통계 대시보드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/stats.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">통계 대시보드</div>
                <div class="section-subtitle">실시간 백엔드 데이터 연동</div>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-navy"><i class="ti ti-users"></i></div>
                <div class="kpi-label">전체 회원</div>
                <div class="kpi-value" th:text="${totalUserCount} ?: 0">0</div>
                <div class="kpi-accent accent-navy"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-mint"><i class="ti ti-cash"></i></div>
                <div class="kpi-label">이번 달 매출</div>
                <div class="kpi-value" th:text="'₩' + (${monthlyRevenue} ?: 0)">₩0</div>
                <div class="kpi-accent accent-mint"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-coral"><i class="ti ti-video"></i></div>
                <div class="kpi-label">전체 콘텐츠</div>
                <div class="kpi-value" th:text="${totalContentCount} ?: 0">0</div>
                <div class="kpi-accent accent-coral"></div>
            </div>
        </div>

        <div style="padding: 40px; text-align: center; color: var(--gray-400); background: #fff; margin-top: 20px; border-radius: 8px;">
            대시보드 통계 및 차트 기능은 회원/결제 테이블 데이터 연동 시 구현됩니다.
        </div>
    </div>
</div>

</body>
</html>
