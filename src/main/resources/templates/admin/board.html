<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 게시판 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/board.css}">
    <style>
        .btn-answer {
            border: 1px solid var(--gray-300, #d1d5db);
            background: #fff;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-answer:hover { background: var(--gray-100, #f3f4f6); }

        .answer-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .answer-modal-overlay.open { display: flex; }

        .answer-modal {
            background: #fff;
            width: 520px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 10px;
            padding: 24px;
        }
        .answer-modal h3 {
            margin: 0 0 16px;
            font-size: 17px;
        }
        .answer-modal .qna-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .answer-modal .qna-content {
            color: var(--gray-500, #6b7280);
            font-size: 13px;
            margin-bottom: 16px;
            white-space: pre-line;
        }
        .answer-list {
            margin-bottom: 16px;
        }
        .answer-item {
            border: 1px solid var(--gray-200, #e5e7eb);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .answer-item-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--gray-400, #9ca3af);
            margin-bottom: 6px;
        }
        .answer-item-content {
            font-size: 14px;
            white-space: pre-line;
            margin-bottom: 8px;
        }
        .answer-item-actions button {
            border: none;
            background: none;
            color: var(--gray-500, #6b7280);
            font-size: 12px;
            cursor: pointer;
            margin-right: 8px;
            padding: 0;
        }
        .answer-item-actions button:hover { text-decoration: underline; }

        .answer-form textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            border: 1px solid var(--gray-300, #d1d5db);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .answer-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }
        .btn-cancel {
            border: 1px solid var(--gray-300, #d1d5db);
            background: #fff;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .btn-submit {
            border: none;
            background: var(--primary, #4f46e5);
            color: #fff;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">게시판 관리 (Q&amp;A)</div>
                <div class="section-subtitle" th:text="|답변 대기 중인 문의: ${pendingQnaCount}건|">0건</div>
            </div>
        </div>

        <div class="card">

            <div style="padding: 24px 24px 0;">
                <div class="board-menu-tabs">

                    <a th:href="@{/admin/board(category='all')}"
                       class="board-tab"
                       th:classappend="${currentCategory == 'all'} ? 'active'">
                        전체
                    </a>

                    <a th:href="@{/admin/board(category='account')}"
                       class="board-tab"
                       th:classappend="${currentCategory == 'account'} ? 'active'">
                        계정/로그인
                    </a>

                    <a th:href="@{/admin/board(category='payment')}"
                       class="board-tab"
                       th:classappend="${currentCategory == 'payment'} ? 'active'">
                        결제/환불
                    </a>

                    <a th:href="@{/admin/board(category='content')}"
                       class="board-tab"
                       th:classappend="${currentCategory == 'content'} ? 'active'">
                        학습 콘텐츠
                    </a>

                    <a th:href="@{/admin/board(category='community')}"
                       class="board-tab"
                       th:classappend="${currentCategory == 'community'} ? 'active'">
                        커뮤니티/신고
                    </a>

                    <a th:href="@{/admin/board(category='bug')}"
                       class="board-tab"
                       th:classappend="${currentCategory == 'bug'} ? 'active'">
                        오류 신고
                    </a>

                </div>


                <form th:action="@{/admin/board}" method="get" class="search-form-wrap">

                    <input type="hidden"
                           name="category"
                           th:value="${currentCategory}">

                    <div class="search-box-container">
                        <i class="ti ti-search"></i>

                        <input type="text"
                               name="kw"
                               class="search-input"
                               th:value="${kw}"
                               placeholder="검색어를 입력해 주세요...">
                    </div>

                    <button type="submit" class="btn-search-submit">
                        <i class="ti ti-search"></i>
                        검색하기
                    </button>

                </form>
            </div>


            <table class="data-table">

                <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>등록일</th>
                    <th>상태</th>
                    <th>답변</th>
                </tr>
                </thead>


                <tbody>

                <tr th:if="${#lists.isEmpty(qnas.content)}">
                    <td colspan="6"
                        style="text-align: center; color: var(--gray-400); padding: 50px 0;">
                        해당 카테고리 내역 중 조건에 일치하는 Q&amp;A 데이터가 존재하지 않습니다.
                    </td>
                </tr>


                <tr th:each="qna : ${qnas.content}">

                    <td th:text="${qna.id}">
                        1
                    </td>

                    <td th:text="${qna.title}">
                        문의 제목
                    </td>

                    <td th:text="${qna.author != null ? qna.author.username : '알 수 없음'}">
                        작성자
                    </td>

                    <td th:text="${qna.createdDate}">
                        작성일
                    </td>

                    <td>
                        <span class="badge"
                              th:classappend="${qna.status == 'COMPLETED'
                              ? 'badge-success'
                              : 'badge-pending'}"
                              th:text="${qna.status}">
                            상태
                        </span>
                    </td>

                    <td>
                        <button type="button"
                                class="btn-answer"
                                th:attr="onclick=|openAnswerModal('answer-modal-${qna.id}')|"
                                th:text="${qna.status == 'COMPLETED' ? '답변보기' : '답변하기'}">
                            답변하기
                        </button>
                    </td>

                </tr>

                </tbody>

            </table>

            <!-- 문의별 답변 모달 -->
            <div th:each="qna : ${qnas.content}"
                 class="answer-modal-overlay"
                 th:id="|answer-modal-${qna.id}|">

                <div class="answer-modal">

                    <h3>Q&amp;A 답변</h3>

                    <div class="qna-title" th:text="${qna.title}">문의 제목</div>
                    <div class="qna-content" th:text="${qna.content}">문의 내용</div>

                    <!-- 기존 답변 목록 -->
                    <div class="answer-list" th:if="${qna.answers != null and !#lists.isEmpty(qna.answers)}">

                        <div class="answer-item" th:each="answer : ${qna.answers}">

                            <div class="answer-item-meta">
                                <span th:text="${(answer.admin != null ? answer.admin.username : '관리자') + ' · ' + #temporals.format(answer.createdDate, 'yyyy-MM-dd HH:mm')}">
                                    관리자 · 2024-01-01 00:00
                                </span>
                            </div>

                            <div class="answer-item-content" th:text="${answer.content}">
                                답변 내용
                            </div>

                            <div class="answer-item-actions">

                                <form th:action="@{'/answer/' + ${answer.id} + '/edit'}"
                                      method="post"
                                      style="display:inline;">
                                    <input type="hidden" name="qnaId" th:value="${qna.id}">
                                    <input type="hidden" name="content" th:value="${answer.content}">
                                    <button type="button"
                                            th:attr="onclick=|editAnswer(this, ${answer.id}, ${qna.id})|">
                                        수정
                                    </button>
                                </form>

                                <form th:action="@{'/answer/' + ${answer.id} + '/delete'}"
                                      method="post"
                                      style="display:inline;"
                                      onsubmit="return confirm('답변을 삭제하시겠습니까?');">
                                    <input type="hidden" name="qnaId" th:value="${qna.id}">
                                    <button type="submit">삭제</button>
                                </form>

                            </div>

                        </div>

                    </div>

                    <!-- 새 답변 작성 -->
                    <form class="answer-form"
                          th:action="@{'/qna/' + ${qna.id} + '/answer'}"
                          method="post">
                        <input type="hidden" name="qnaId" th:value="${qna.id}">
                        <input type="hidden" name="returnTo" th:value="${#httpServletRequest.requestURI + (#httpServletRequest.queryString != null ? '?' + #httpServletRequest.queryString : '')}">
                        <textarea name="content" placeholder="답변 내용을 입력해 주세요..." required></textarea>

                        <div class="answer-modal-footer">
                            <button type="button" class="btn-cancel"
                                    th:attr="onclick=|closeAnswerModal('answer-modal-${qna.id}')|">
                                닫기
                            </button>
                            <button type="submit" class="btn-submit">답변 등록</button>
                        </div>
                    </form>

                </div>

            </div>


            <!-- 페이지네이션 -->
            <div class="pagination" th:if="${qnas.totalPages > 0}">

                <!-- 이전 페이지 그룹 -->
                <a class="page-btn"
                   th:if="${qnas.number > 0}"
                   th:href="@{/admin/board(
            page=${qnas.number - 1},
            category=${currentCategory},
            kw=${kw}
       )}">
                    &lt;
                </a>


                <!-- 페이지 번호 (5개 단위) -->
                <span th:each="pageNum : ${#numbers.sequence(
        (qnas.number / 5) * 5,
        T(java.lang.Math).min((qnas.number / 5) * 5 + 4, qnas.totalPages - 1)
    )}">

        <a class="page-btn"
           th:href="@{/admin/board(
                page=${pageNum},
                category=${currentCategory},
                kw=${kw}
           )}"
           th:text="${pageNum + 1}"
           th:classappend="${pageNum == qnas.number} ? 'active'">
        </a>

    </span>


                <!-- 다음 페이지 그룹 -->
                <a class="page-btn"
                   th:if="${qnas.number < qnas.totalPages - 1}"
                   th:href="@{/admin/board(
            page=${qnas.number + 1},
            category=${currentCategory},
            kw=${kw}
       )}">
                    &gt;
                </a>

            </div>


        </div>

    </div>

</div>

<script th:inline="javascript">
    function openAnswerModal(modalId) {
        document.getElementById(modalId).classList.add('open');
    }

    function closeAnswerModal(modalId) {
        document.getElementById(modalId).classList.remove('open');
    }

    // 답변 수정 클릭 시, 새 답변 작성 폼에 기존 내용을 채우고
    // 제출 대상을 수정 엔드포인트로 변경한다.
    function editAnswer(btn, answerId, qnaId) {
        var modal = btn.closest('.answer-modal');
        var editForm = btn.closest('form');
        var content = editForm.querySelector('input[name="content"]').value;

        var writeForm = modal.querySelector('.answer-form');
        var textarea = writeForm.querySelector('textarea[name="content"]');

        textarea.value = content;
        writeForm.setAttribute('action', '/answer/' + answerId + '/edit');
        writeForm.querySelector('.btn-submit').textContent = '답변 수정 완료';
        textarea.focus();
    }

    // 모달 바깥 영역 클릭 시 닫기
    document.querySelectorAll('.answer-modal-overlay').forEach(function (overlay) {
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) {
                overlay.classList.remove('open');
            }
        });
    });
</script>

</body>
</html>
