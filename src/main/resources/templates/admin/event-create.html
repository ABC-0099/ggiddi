<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 이벤트 등록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/event-create.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">이벤트 등록</div>
                <div class="section-subtitle">새로운 이벤트를 등록합니다.</div>
            </div>
            <div class="section-actions">
                <a class="btn btn-outline" th:href="@{/admin/event}">목록으로</a>
            </div>
        </div>

        <form th:action="@{/admin/event/create}" method="post" enctype="multipart/form-data">

            <!-- 이벤트 정보 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">
                        <i class="ti ti-calendar-plus"></i>
                        이벤트 정보
                    </div>
                </div>

                <div class="event-form">
                    <div class="form-group">
                        <label>이벤트 제목 <span class="required">*</span></label>
                        <input type="text" name="title" class="form-input" placeholder="이벤트 제목을 입력하세요." required>
                    </div>

                    <div class="form-group">
                        <label>이벤트 내용 <span class="required">*</span></label>
                        <textarea name="content" class="form-textarea" rows="8" placeholder="이벤트 내용을 입력하세요." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>이벤트 기간</label>
                        <div class="form-row">
                            <input type="date" name="startDate" class="form-input">
                            <input type="date" name="endDate" class="form-input">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>이벤트 상태</label>
                        <select name="status" class="form-input">
                            <option value="UPCOMING">진행 예정</option>
                            <option value="ONGOING">진행 중</option>
                            <option value="ENDED">종료</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 이벤트 포스터 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">
                        <i class="ti ti-photo"></i>
                        이벤트 포스터
                    </div>
                </div>
                <div class="poster-upload">
                    <i class="ti ti-photo-plus upload-icon"></i>
                    <h3>포스터 업로드</h3>
                    <p>이벤트 상세 페이지에 표시될 포스터를 업로드하세요.</p>
                    <label class="btn btn-outline" style="cursor:pointer;">
                        <i class="ti ti-upload"></i>
                        파일 선택
                        <input type="file" name="posterFile" accept="image/*" style="display:none;">
                    </label>
                </div>
            </div>

            <!-- 이벤트 썸네일 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">
                        <i class="ti ti-photo"></i>
                        이벤트 썸네일
                    </div>
                </div>
                <div class="poster-upload">
                    <i class="ti ti-photo-plus upload-icon"></i>
                    <h3>썸네일 업로드</h3>
                    <p>이벤트 목록에 표시될 썸네일 이미지를 업로드하세요.</p>
                    <label class="btn btn-outline" style="cursor:pointer;">
                        <i class="ti ti-upload"></i>
                        파일 선택
                        <input type="file" name="thumbnailFile" accept="image/*" style="display:none;">
                    </label>
                </div>
            </div>

            <!-- 등록 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">
                        <i class="ti ti-device-floppy"></i>
                        등록
                    </div>
                </div>
                <div class="event-btn-wrap">
                    <a class="btn btn-outline" th:href="@{/admin/event}">취소</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="ti ti-device-floppy"></i>
                        이벤트 등록
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
