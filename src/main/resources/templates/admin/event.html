<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼역띠귿 - 이벤트 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">이벤트 관리</div>
                <div class="section-subtitle">진행 중인 이벤트와 참여 현황을 관리하세요</div>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/event/create}">
                <i class="ti ti-plus"></i>
                새 이벤트 등록
            </a>
        </div>

        <!-- KPI -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-mint"><i class="ti ti-calendar-event"></i></div>
                <div class="kpi-label">진행 중</div>
                <div class="kpi-value" th:text="${ongoingEventCount} ?: '2'">2</div>
                <div class="kpi-change" style="color:var(--gray-400);">현재 참여 가능</div>
                <div class="kpi-accent accent-mint"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-navy"><i class="ti ti-calendar-plus"></i></div>
                <div class="kpi-label">예정</div>
                <div class="kpi-value" th:text="${upcomingEventCount} ?: '1'">1</div>
                <div class="kpi-change" style="color:var(--gray-400);">오픈 대기 중</div>
                <div class="kpi-accent accent-navy"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-amber"><i class="ti ti-users"></i></div>
                <div class="kpi-label">누적 참여자</div>
                <div class="kpi-value" th:text="${totalEventParticipants} ?: '386'">386</div>
                <div class="kpi-change up"><i class="ti ti-trending-up"></i> 전체 이벤트 합산</div>
                <div class="kpi-accent accent-amber"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-coral"><i class="ti ti-calendar-off"></i></div>
                <div class="kpi-label">종료됨</div>
                <div class="kpi-value" th:text="${endedEventCount} ?: '5'">5</div>
                <div class="kpi-change" style="color:var(--gray-400);">누적 종료 이벤트</div>
                <div class="kpi-accent accent-coral"></div>
            </div>
        </div>

        <div class="filter-bar">
            <div class="search-wrap">
                <i class="ti ti-search"></i>
                <input type="text" class="search-input" placeholder="이벤트명 검색...">
            </div>
            <select class="filter-select">
                <option>전체 상태</option>
                <option>진행중</option>
                <option>예정</option>
                <option>종료</option>
            </select>
            <select class="filter-select">
                <option>최신 등록순</option>
                <option>시작일순</option>
                <option>참여자 많은순</option>
            </select>
        </div>

        <div class="card">
            <table class="data-table">
                <thead>
                <tr>
                    <th style="width:40px">#</th>
                    <th>이벤트명</th>
                    <th>기간</th>
                    <th>참여자</th>
                    <th>등록일</th>
                    <th style="text-align:center">상태</th>
                    <th style="text-align:center; width:110px">작업</th>
                </tr>
                </thead>
                <tbody>
                <tbody>

                <tr th:each="event, iter : ${events}">
                    <td th:text="${iter.count}"></td>

                    <td>
                        <div class="content-title-cell">
                            <div class="content-thumb">
                                <i class="ti ti-gift"></i>
                            </div>
                            <div class="content-name"
                                 th:text="${event.title}">
                            </div>
                        </div>
                    </td>

                    <td>
                        <span th:text="${event.startDate}"></span>
                        ~
                        <span th:text="${event.endDate}"></span>
                    </td>

                    <td th:text="${event.participantCount + '명'}"></td>

                    <td th:text="${event.createdDate}"></td>

                    <td style="text-align:center">
                        <span class="badge badge-success"
                              th:if="${event.status == 'ONGOING'}">
                            진행중
                        </span>

                        <span class="badge badge-info"
                              th:if="${event.status == 'UPCOMING'}">
                            예정
                        </span>

                        <span class="badge badge-gray"
                              th:if="${event.status == 'ENDED'}">
                            종료
                        </span>
                    </td>

                    <td style="text-align:center">
                        <a class="btn btn-outline btn-sm"
                           th:href="@{/admin/event/edit/{id}(id=${event.id})}">
                            <i class="ti ti-edit"></i>
                            수정
                        </a>
                        <a class="btn btn-outline btn-sm"
                           th:href="@{/admin/event/delete/{id}(id=${event.id})}">
                            <i class="ti ti-edit"></i>
                            삭제
                        </a>
                    </td>

                </tr>
                </tbody>
            </table>
            <div class="pagination">
                <span class="pagination-info">전체 <span th:text="${totalEventCount} ?: '8'">8</span>건 중 1–3 표시</span>
                <div class="pagination-btns">
                    <button class="page-btn"><i class="ti ti-chevron-left" style="font-size:12px"></i></button>
                    <button class="page-btn active">1</button>
                    <button class="page-btn">2</button>
                    <button class="page-btn">3</button>
                    <button class="page-btn"><i class="ti ti-chevron-right" style="font-size:12px"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
