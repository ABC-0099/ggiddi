<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모의고사 관리 - 끼역띠귿</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/board.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-quiz.css}">
    <link rel="stylesheet" th:href="@{/css/mock/list.css}">
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

<div class="main">

    <header th:replace="~{admin/fragments/topbar :: topbar}"></header>

    <div class="content">
        <div class="section-header">
            <div>
                <div class="section-title">모의고사 관리</div>
                <div class="section-subtitle">테마별 회차(1회차, 2회차...)로 모의고사를 관리하세요</div>
            </div>
            <div class="section-actions">
                <a th:href="@{/admin/mock/chuga}" class="btn btn-primary">
                    <i class="ti ti-plus"></i>새 회차 등록
                </a>
            </div>
        </div>

        <!-- 서브탭: 연습퀴즈 관리 / 모의고사 관리 -->
        <div class="board-menu-tabs">
            <a th:href="@{/admin/quiz}" class="board-tab">연습퀴즈</a>
            <a th:href="@{/admin/mock}" class="board-tab active">모의고사 관리</a>
        </div>

        <!-- 전체 펼치기/접기 -->
        <button type="button" class="qa-expand-all-btn" id="qaExpandAllBtn" onclick="toggleAllCategories()">
            <i class="ti ti-arrows-maximize" id="qaExpandAllIcon"></i>
            <span id="qaExpandAllLabel">전체 펼치기</span>
        </button>

        <!-- 카테고리(테마)별 섹션 -->
        <div class="qa-category-section" th:each="entry, catIter : ${groupedExams}" th:classappend="${catIter.index == 0} ? 'open'">

            <div class="qa-category-head" onclick="toggleCategory(this)">
                <i class="ti ti-chevron-right qa-category-chevron"></i>
                <span class="qa-category-badge" th:text="'테마 ' + (${catIter.index} + 1)">테마 1</span>
                <span class="qa-category-title" th:text="${entry.key}">케이팝</span>
                <span class="qa-category-count" th:text="${#lists.size(entry.value)} + '회차'">0회차</span>
            </div>

            <div class="qa-category-body">
                <div class="card">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th style="width:40px">#</th>
                            <th>회차</th>
                            <th style="text-align:center">문항 수</th>
                            <th style="text-align:center">제한시간</th>
                            <th style="text-align:center; width:190px">작업</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="exam, iter : ${entry.value}">
                            <td style="color:var(--gray-400)" th:text="${iter.count}">1</td>
                            <td>
                                <div class="content-title-cell">
                                    <div class="content-thumb"><i class="ti ti-clipboard-list"></i></div>
                                    <div class="content-name" th:text="${exam.round} + '회차 - ' + ${exam.title}">1회차 - 1회차 모의고사</div>
                                </div>
                            </td>
                            <td style="text-align:center" th:text="${exam.questions.size()} + '문항'">20문항</td>
                            <td style="text-align:center" th:text="${exam.timeLimitMinutes} + '분'">30분</td>
                            <td style="text-align:center; white-space:nowrap;">
                                <div style="display:flex; justify-content:center; gap:6px;">
                                    <a th:href="@{/admin/mock/view/{id}(id=${exam.id})}" class="btn btn-outline btn-sm">
                                        <i class="ti ti-eye"></i>보기
                                    </a>
                                    <a th:href="@{/admin/mock/sujung/{id}(id=${exam.id})}" class="btn btn-outline btn-sm">
                                        <i class="ti ti-edit"></i>수정
                                    </a>
                                    <button class="btn btn-danger-outline btn-sm" th:onclick="'deleteExam(' + ${exam.id} + ')'">
                                        <i class="ti ti-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 데이터 없을 때 -->
        <div class="card" th:if="${groupedExams == null or #maps.isEmpty(groupedExams)}">
            <div style="text-align:center; color:var(--gray-400); padding:32px;">
                아직 등록된 모의고사가 없어요. "새 회차 등록"으로 첫 회차를 만들어보세요.
            </div>
        </div>
    </div>
</div>

<script>
    function getCsrfToken() {
        const match = document.cookie.match(/(^|;\s*)XSRF-TOKEN=([^;]*)/);
        return match ? decodeURIComponent(match[2]) : '';
    }

    function toggleCategory(headEl) {
        headEl.closest('.qa-category-section').classList.toggle('open');
    }

    function toggleAllCategories() {
        const sections = document.querySelectorAll('.qa-category-section');
        const allOpen = Array.from(sections).every(s => s.classList.contains('open'));
        sections.forEach(s => s.classList.toggle('open', !allOpen));

        document.getElementById('qaExpandAllLabel').textContent = allOpen ? '전체 펼치기' : '전체 접기';
        document.getElementById('qaExpandAllIcon').className = allOpen ? 'ti ti-arrows-maximize' : 'ti ti-arrows-minimize';
    }

    function deleteExam(id) {
        if (!confirm('이 모의고사 회차를 삭제할까요? 문항도 함께 삭제됩니다.')) return;

        fetch('/api/admin/mock/' + id, {
            method: 'DELETE',
            headers: { 'X-XSRF-TOKEN': getCsrfToken() }
        })
            .then(res => {
                if (!res.ok) throw new Error('삭제 실패');
                location.reload();
            })
            .catch(err => {
                console.error(err);
                alert('삭제 중 오류가 발생했어요.');
            });
    }
</script>

</body>
</html>
