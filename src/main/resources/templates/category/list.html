<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학습센터 | 끼역띠귿</title>
    <link rel="stylesheet" th:href="@{/css/layout/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/category/list.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

</head>
<body>

<div class="bg-orbs"><div class="orb o1"></div><div class="orb o2"></div></div>

<!-- 네브바 -->
<div th:replace="~{layout/navbar :: navbar(currentMenu='lectures')}"></div>

<!-- 헤더 -->
<div class="page-header">
    <div class="page-header-text">
        <div class="page-header-title-row">
            <div class="page-header-badge">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
            </div>
            <h1>강의 목록</h1>
        </div>
        <p>단계별로 한국어를 배워봐요. 현재 2단계 단어 월드 진행 중이에요 🗺️</p>
    </div>

    <!-- 관리자: 카테고리 관리 패널 (통계 박스 대신 노출) -->
    <div class="admin-category-box" sec:authorize="hasRole('ADMIN')">
        <div class="acb-header">🗂️ 카테고리 관리</div>

        <button type="button" id="btnOpenAddCategory" class="btn-add-category acb-add-btn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            카테고리 추가
        </button>

        <div class="cat-manage-select">
            <select id="catManageSelect">
                <option value="">카테고리 선택</option>
                <option th:each="category : ${list}" th:value="${category.id}" th:text="${category.title}"></option>
            </select>
            <a id="btnGoEditCategory" class="btn-manage-category" href="#">수정</a>
            <button type="button" id="btnDeleteSelectedCategory" class="btn-manage-category btn-manage-delete">삭제</button>
        </div>
    </div>

    <!-- 마지막으로 본 강의 + 진행 요약 작은 박스 (일반 유저만) -->
    <div class="last-lecture-box" sec:authorize="!hasRole('ADMIN')">

        <!-- 통계 3개 -->
        <div style="display:flex;gap:0;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);">
            <div style="flex:1;text-align:center;">
                <div style="font-size:16px;font-weight:700;color:var(--mint-dark);letter-spacing:-.5px;" th:text="${completedCount} + '강'">8강</div>
                <div style="font-size:10px;color:var(--ink-faint);margin-top:2px;">완료 강의</div>
            </div>
            <div style="width:1px;background:var(--border);flex-shrink:0;"></div>
            <div style="flex:1;text-align:center;">
                <div style="font-size:16px;font-weight:700;color:var(--mint-dark);letter-spacing:-.5px;" th:text="${streakDays} + '일🔥'">7일🔥</div>
                <div style="font-size:10px;color:var(--ink-faint);margin-top:2px;">연속 출석</div>
            </div>
        </div>

        <!-- 마지막 강의 -->
        <div class="llb-header">🕐 마지막으로 본 강의</div>

        <div th:if="${lastProgress != null}"
             th:with="continuePayOrFree=(${paidMap.get(lastProgress.content.category.id)} or ${lastProgress.content.free})">
            <div class="llb-card">
                <div class="llb-thumb">📖</div>
                <div class="llb-info">
                    <span class="llb-stage" th:text="${lastProgress.content.category.title}">단계 · 단어</span>
                    <div class="llb-title" th:text="${lastProgress.content.title}">강의 제목</div>
                </div>
            </div>
            <div class="llb-prog-bar">
                <div class="llb-prog-fill" th:style="'width:' + ${avgProgress} + '%'"></div>
            </div>
            <div class="llb-prog-row">
                <span class="llb-prog-label">전체 진도율</span>
                <span class="llb-prog-pct" th:text="${avgProgress} + '%'">30%</span>
            </div>
            <a th:if="${continuePayOrFree}"
               th:href="@{/content/view/{id}(id=${continueContent.id})}" class="llb-btn">이어보기 →</a>
            <a th:if="${!continuePayOrFree}"
               th:href="@{/orderPay/list(categoryId=${lastProgress.content.category.id})}" class="llb-btn">결제하러 가기 →</a>
        </div>

        <div th:if="${lastProgress == null}">
            <div class="llb-card">
                <div class="llb-thumb">📖</div>
                <div class="llb-info">
                    <span class="llb-stage">시작해볼까요?</span>
                    <div class="llb-title">아직 시청한 강의가 없어요</div>
                </div>
            </div>
            <div class="llb-prog-bar"><div class="llb-prog-fill" style="width:0%"></div></div>
            <div class="llb-prog-row">
                <span class="llb-prog-label">전체 진도율</span>
                <span class="llb-prog-pct">0%</span>
            </div>
            <a th:if="${!paidMap.containsValue(true)}" th:href="@{/orderPay/list}" class="llb-btn">결제하러 가기 →</a>
            <a th:if="${paidMap.containsValue(true)}" href="#lecture-wrap" class="llb-btn">강의 보러가기 →</a>
        </div>
    </div>
</div>

<!-- 탭 -->
<div class="filter-bar">
    <div class="tabs" id="tabsWrap">
        <button class="tab active" data-cat-id="all">전체</button>
        <div class="tab-chip" th:each="category : ${list}">
            <button class="tab" th:text="${category.title}" th:attr="data-cat-id=${category.id}">1단계 음절</button>
            <span class="tab-admin" sec:authorize="hasRole('ADMIN')">
                <button type="button" class="tab-admin-btn tab-edit-btn" title="카테고리 수정"
                        th:attr="data-id=${category.id}, data-name=${category.title}">
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
                    </svg>
                </button>
                <button type="button" class="tab-admin-btn tab-delete-btn" title="카테고리 삭제"
                        th:attr="data-id=${category.id}, data-name=${category.title}">
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </span>
        </div>

    </div>
    <div style="display:flex; align-items:center; gap:10px;">
        <select class="sort-select">
            <option>순서대로</option>
            <option>최신순</option>
            <option>인기순</option>
        </select>
    </div>
</div>

<!-- 강의 목록 -->
<div class="lecture-wrap" id="lecture-wrap">

    <div class="stage-section" th:each="category, catStat : ${list}">
        <div class="stage-header">
            <span class="stage-badge" th:classappend="'sb-' + ${catStat.count}" th:text="${catStat.count} + '단계'"></span>
            <h2 th:text="${category.title}"></h2>
            <span class="stage-count" th:text="${category.instructor}"></span>
        </div>

        <div class="lecture-grid">
            <a th:each="content : ${contentMap.get(category.id)}"
               th:with="isAdmin=${#authorization.expression('hasRole(''ADMIN'')')},
                        isPublished=(${content.status} == 'PUBLISHED'),
                        payOrFree=(${paidMap.get(category.id)} or ${content.free}),
                        unlocked=(${isAdmin} or (${isPublished} and ${payOrFree})),
                        needsPayment=(!${isAdmin} and ${isPublished} and !${payOrFree})"
               th:href="${unlocked} ? @{/content/view/{id}(id=${content.id})} : (${needsPayment} ? @{/orderPay/list(categoryId=${category.id})} : '#')"
               th:classappend="${unlocked} ? '' : (${needsPayment} ? 'locked' : 'locked unavailable')"
               class="lc">
                <button type="button" class="lc-edit-btn" sec:authorize="hasRole('ADMIN')" title="강의 수정"
                        th:attr="data-id=${content.id}, data-title=${content.title}, data-sequence=${content.sequence}, data-cat-id=${category.id}">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
                    </svg>
                </button>
                <div class="lc-thumb">
                    <img th:if="${content.thumbFileName != null and !content.thumbFileName.isEmpty()}"
                         th:src="@{${content.thumbFileName}}" class="lc-thumb-img" alt="" />
                    <div th:unless="${content.thumbFileName != null and !content.thumbFileName.isEmpty()}"
                         class="lc-thumb-icon">📖</div>
                    <div class="lc-play" th:if="${unlocked}"><div class="play-btn">▶</div></div>
                    <div class="lc-lock" th:unless="${unlocked}">🔒</div>

                    <!-- 공개 상태 뱃지: 임시저장 / 예약공개가 완료·진행중 뱃지보다 우선 -->
                    <span th:if="${content.status == 'DRAFT'}" class="lc-status ls-draft">임시</span>
                    <span th:if="${content.status == 'SCHEDULED'}" class="lc-status ls-scheduled"
                          th:text="${#temporals.format(content.publishAt, 'MM.dd HH:mm')} + ' 공개'">예약</span>
                    <span th:if="${content.status == 'PUBLISHED' and unlocked and content.progressPercent == 100}" class="lc-status ls-done">완료</span>
                    <span th:if="${content.status == 'PUBLISHED' and unlocked and content.progressPercent > 0 and content.progressPercent < 100}" class="lc-status ls-ing">진행 중</span>
                    <span th:if="${content.status == 'PUBLISHED' and content.free and !paidMap.get(category.id) and content.progressPercent == 0}" class="lc-status ls-free">무료 공개</span>
                </div>
                <div class="lc-body">
                    <div class="lc-top">
                        <span class="lc-num" th:text="${catStat.count} + '-' + ${content.sequence} + '강'"></span>
                    </div>
                    <div class="lc-title" th:text="${content.title}"></div>
                    <div class="lc-progress-wrap">
                        <div class="lc-prog-header">
                            <span class="lc-prog-label">진행률</span>
                            <span class="lc-prog-pct"
                                  th:classappend="${unlocked} ? (${content.progressPercent} == 100 ? 'done' : (${content.progressPercent} > 0 ? 'ing' : 'none')) : 'none'"
                                  th:text="${unlocked} ? (${content.progressPercent} == 100 ? '100% 완료 ✓' : ${content.progressPercent} + '%') : (${needsPayment} ? '🔒 잠김' : '🔒 준비중')">
                            </span>
                        </div>
                        <div class="lc-prog-bar">
                            <div class="lc-prog-fill"
                                 th:classappend="${unlocked} and ${content.progressPercent} > 0 and ${content.progressPercent} < 100 ? 'ing'"
                                 th:style="'width:' + (${unlocked} ? ${content.progressPercent} : 0) + '%'">
                            </div>
                        </div>
                    </div>
                </div>
            </a>

            <p th:if="${#lists.isEmpty(contentMap.get(category.id))}" style="padding:20px;color:var(--ink-faint);">
                아직 등록된 강의가 없어요.
            </p>

            <a class="lc lc-add-tile" sec:authorize="hasRole('ADMIN')"
               th:href="@{/content/chuga/{categoryId}(categoryId=${category.id})}">
                <div class="lc-add-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </div>
                <div class="lc-add-text">강의 추가</div>
            </a>
        </div>
    </div>

</div>

<!-- 푸터 -->
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/drag-translate :: dragTranslate}"></div>

<!-- 카테고리 삭제 확인 모달 (관리자 전용) -->
<div class="cat-delete-overlay" id="catDeleteOverlay">
    <div class="cat-delete-card">
        <div class="cat-delete-icon">🗑️</div>
        <div class="cat-delete-title">카테고리를 삭제할까요?</div>
        <div class="cat-delete-desc" id="catDeleteDesc"></div>
        <div class="cat-delete-actions">
            <button type="button" class="btn-cancel" id="catDeleteCancelBtn">취소</button>
            <button type="button" class="btn-delete-confirm" id="catDeleteConfirmBtn">삭제</button>
        </div>
    </div>
</div>

<!-- 카테고리(탭) 추가/수정 모달 (관리자 전용) -->
<div class="cat-add-overlay" id="catAddOverlay">
    <div class="cat-add-card">
        <div class="cat-add-head">
            <div class="cat-add-head-left">
                <span class="cat-add-head-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l9 5.5-9 5.5-9-5.5L12 3z"/>
                        <path d="M3 8.5v7L12 21l9-5.5v-7"/>
                    </svg>
                </span>
                <div class="cat-add-title" id="catModalTitle">카테고리 추가</div>
            </div>
            <button type="button" class="cat-add-close" id="catAddCloseBtn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <form id="categoryAddForm">
            <input type="hidden" id="catId" name="id" value="" />

            <div class="field">
                <label for="catName">카테고리명 <span class="required">*</span></label>
                <input type="text" id="catName" name="title" placeholder="예: 5단계 발음" maxlength="20" required />
            </div>

            <div class="field">
                <label for="catOrder">순서 <span class="field-optional">(선택, 비우면 맨 뒤에 추가)</span></label>
                <input type="number" id="catOrder" name="orderNum" placeholder="예: 5" min="1" />
            </div>

            <!-- 실시간 탭 미리보기 -->
            <div class="field">
                <label>미리보기</label>
                <div class="cat-tab-preview">
                    <span class="tab" id="catPreviewTab">카테고리명</span>
                </div>
            </div>

            <div class="cat-add-actions">
                <button type="button" class="btn-cancel" id="catAddCancelBtn">취소</button>
                <button type="submit" class="btn-submit" id="catSubmitBtn">등록</button>
            </div>
        </form>
    </div>
</div>


<script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    // ── 관리자: 카테고리 삭제 (공용 함수로 리팩터링) ──
    (function () {
      var overlay = document.getElementById('catDeleteOverlay');
      var descEl = document.getElementById('catDeleteDesc');
      var cancelBtn = document.getElementById('catDeleteCancelBtn');
      var confirmBtn = document.getElementById('catDeleteConfirmBtn');
      var csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
      var csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
      var targetId = null;

      // 어디서든 호출 가능한 공용 오픈 함수 (탭 아이콘 / 드롭다운 둘 다 사용)
      window.openCatDeleteModal = function (id, name) {
        targetId = id;
        descEl.textContent = '"' + name + '" 카테고리와 그 안의 강의가 함께 삭제될 수 있어요.';
        overlay.classList.add('active');
      };

      document.querySelectorAll('.tab-delete-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          window.openCatDeleteModal(btn.dataset.id, btn.dataset.name);
        });
      });

      cancelBtn.addEventListener('click', function () {
        targetId = null;
        overlay.classList.remove('active');
      });

      confirmBtn.addEventListener('click', function () {
        if (!targetId) return;
        var headers = {};
        if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

        fetch('/category/delete/' + targetId, { method: 'DELETE', headers: headers })
          .then(function (res) {
            if (res.ok) {
              window.location.reload();
            } else {
              alert('삭제에 실패했어요. 다시 시도해주세요.');
            }
          })
          .catch(function () {
            alert('삭제 중 오류가 발생했어요.');
          })
          .finally(function () {
            overlay.classList.remove('active');
            targetId = null;
          });
      });
    })();

    // ── 관리자: 상단 드롭다운으로 카테고리 수정/삭제 ──
    (function () {
      var select = document.getElementById('catManageSelect');
      if (!select) return; // 관리자 아니면 없음

      var editBtn = document.getElementById('btnGoEditCategory');
      var deleteBtn = document.getElementById('btnDeleteSelectedCategory');

      editBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (!select.value) { alert('수정할 카테고리를 선택해주세요.'); return; }
        window.location.href = '/category/sujung/' + select.value;
      });

      deleteBtn.addEventListener('click', function () {
        if (!select.value) { alert('삭제할 카테고리를 선택해주세요.'); return; }
        var name = select.options[select.selectedIndex].textContent;
        window.openCatDeleteModal(select.value, name);
      });
    })();

    // ── 관리자: 카테고리 추가/수정 ──
    (function () {
      var openBtn = document.getElementById('btnOpenAddCategory');
      if (!openBtn) return; // 관리자 아니면 버튼 자체가 없음

      var overlay = document.getElementById('catAddOverlay');
      var closeBtn = document.getElementById('catAddCloseBtn');
      var cancelBtn = document.getElementById('catAddCancelBtn');
      var form = document.getElementById('categoryAddForm');
      var modalTitle = document.getElementById('catModalTitle');
      var submitBtn = document.getElementById('catSubmitBtn');
      var csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
      var csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

      var idInput = document.getElementById('catId');
      var nameInput = document.getElementById('catName');
      var orderInput = document.getElementById('catOrder');
      var previewTab = document.getElementById('catPreviewTab');

      function updatePreview() {
        previewTab.textContent = nameInput.value || '카테고리명';
      }

      function openForAdd() {
        form.reset();
        idInput.value = '';
        modalTitle.textContent = '카테고리 추가';
        submitBtn.textContent = '등록';
        updatePreview();
        overlay.classList.add('active');
      }

      function openForEdit(id, name, order) {
        form.reset();
        idInput.value = id;
        nameInput.value = name;
        orderInput.value = order || '';
        modalTitle.textContent = '카테고리 수정';
        submitBtn.textContent = '수정 완료';
        updatePreview();
        overlay.classList.add('active');
      }

      function closeModal() {
        overlay.classList.remove('active');
        form.reset();
        updatePreview();
      }

      openBtn.addEventListener('click', openForAdd);
      closeBtn.addEventListener('click', closeModal);
      cancelBtn.addEventListener('click', closeModal);
      nameInput.addEventListener('input', updatePreview);

      document.querySelectorAll('.tab-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          openForEdit(btn.dataset.id, btn.dataset.name, btn.dataset.order);
        });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var isEdit = !!idInput.value;
        var url = isEdit ? '/category/sujungProc' : '/category/chugaProc';

        submitBtn.disabled = true;
        submitBtn.textContent = isEdit ? '수정 중...' : '등록 중...';

        var body = new URLSearchParams(new FormData(form));
        var headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

        fetch(url, { method: 'POST', headers: headers, body: body })
          .then(function (res) {
            if (res.ok || res.redirected) {
              window.location.reload();
            } else {
              alert((isEdit ? '수정' : '등록') + '에 실패했어요. 다시 시도해주세요.');
              submitBtn.disabled = false;
              submitBtn.textContent = isEdit ? '수정 완료' : '등록';
            }
          })
          .catch(function () {
            alert('처리 중 오류가 발생했어요.');
            submitBtn.disabled = false;
            submitBtn.textContent = isEdit ? '수정 완료' : '등록';
          });
      });
    })();

    // ── 관리자: 강의 수정 → 전체 수정 페이지로 바로 이동 ──
    (function () {
      document.querySelectorAll('.lc-edit-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = '/content/sujung/' + btn.dataset.id;
        });
      });
    })();
</script>

</body>
</html>
