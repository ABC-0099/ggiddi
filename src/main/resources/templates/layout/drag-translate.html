<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  ================================
  사용법 (다른 페이지에서 삽입, footer 근처에 한 줄 추가):
  <div th:replace="~{layout/drag-translate :: dragTranslate}"></div>

  텍스트를 드래그하면 선택 영역 근처에 "번역" 버튼이 뜨고,
  클릭하면 /api/translate 호출해서 팝업으로 번역 결과를 보여줌.
  타깃 언어는 우측 하단 지구본 버튼으로 바꿀 수 있고 localStorage에 기억됨.
  (띠귿이 AI 튜터 버튼 바로 위에 쌓이도록 배치되어 있고, 띠귿이 패널이 열리면
   z-index가 더 낮아서 패널 뒤로 자연스럽게 가려짐 — 겹침 문제 없음)

  ── 최초 1회 온보딩 안내 (선택) ──
  강의/학습 페이지처럼 첫 진입 유저에게 "드래그하면 번역 버튼이 떠요"를
  안내하고 싶은 곳에서 위 fragment와 같이 한 줄 추가:
  <div th:replace="~{layout/drag-translate :: dragTranslateOnboarding}"></div>
  (dragTranslate 없이 이것만 단독으로 넣으면 안내만 뜨고 실제 번역 기능은
   동작하지 않으니 항상 두 fragment를 같이 넣을 것)
  localStorage에 1회 노출 여부가 저장되므로 페이지마다 넣어도 유저 기준 1번만 뜸.
  ※ 노출 정책: 페이지 로드 시 사이트 언어가 한국어면 1번 노출 + 이후 언어 토글을 눌러서
    한국어로 "바뀔 때마다" 매번 다시 노출 (영어로 전환된 상태면 안 뜸)
  ※ "4시간 동안 안 보기" 버튼을 누르면 4시간 동안은 위 조건을 만족해도 안 뜸
    (localStorage에 만료 시각 저장, kkyd_dt_onboarding_snooze_until)
  ※ 팝업 내용 자체는 언어 토글과 무관하게 항상 영어로 고정 (아직 EN 버튼을 못 찾은
    외국인 유저에게 "드래그하면 번역된다"는 걸 영어로 알려주는 게 목적이라, 한국어일 땐
    안 만들어둠)
  ================================
-->

<div th:fragment="dragTranslate">
  <link th:href="@{/css/layout/drag-translate.css}" rel="stylesheet" />


  <!-- 드래그 시 뜨는 작은 "번역" 트리거 버튼 -->
  <button id="dtTriggerBtn" class="dt-trigger-btn" type="button">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 5h9M8 3v2M11 5c-.3 3-2 6-5 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 12l3-1.5M13 21l4-9 4 9M14.5 18h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span data-i18n="dt.trigger_btn">번역</span>
  </button>

  <!-- 번역 결과 팝업 -->
  <div id="dtPopup" class="dt-popup" hidden>
    <div class="dt-popup-header">
      <span class="dt-popup-title" data-i18n="dt.popup_title">번역</span>
      <button id="dtCloseBtn" class="dt-close-btn" type="button" aria-label="닫기">×</button>
    </div>
    <div id="dtOriginal" class="dt-original"></div>
    <div id="dtResult" class="dt-result">
      <span class="dt-loading" data-i18n="dt.loading">번역 중...</span>
    </div>
  </div>

  <!-- 우측 하단 고정 언어 선택 버튼 (띠귿이 버튼 바로 위에 쌓임) -->
  <div id="dtLangWidget" class="dt-lang-widget">
    <button id="dtLangToggle" class="dt-lang-toggle" type="button" title="번역 언어 설정">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3 12h18M12 3c2.5 2.5 4 5.8 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.8-4-9s1.5-6.5 4-9z" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
    <ul id="dtLangMenu" class="dt-lang-menu" hidden>
      <li data-lang="en">English</li>
      <li data-lang="zh">中文</li>
      <li data-lang="ja">日本語</li>
      <li data-lang="vi">Tiếng Việt</li>
      <li data-lang="tl">Filipino</li>
      <li data-lang="id">Bahasa Indonesia</li>
      <li data-lang="th">ไทย</li>
    </ul>
  </div>

  <script th:inline="javascript">
    (function () {
      const STORAGE_KEY = 'kkyd_translate_lang';
      const LANG_LABELS = {
        en: 'English', zh: '中文', ja: '日本語', vi: 'Tiếng Việt',
        tl: 'Filipino', id: 'Bahasa Indonesia', th: 'ไทย'
      };

      const triggerBtn = document.getElementById('dtTriggerBtn');
      const popup = document.getElementById('dtPopup');
      const originalEl = document.getElementById('dtOriginal');
      const resultEl = document.getElementById('dtResult');
      const closeBtn = document.getElementById('dtCloseBtn');
      const langToggle = document.getElementById('dtLangToggle');
      const langMenu = document.getElementById('dtLangMenu');

      let currentSelectionText = '';
      let currentRange = null;

      function getTargetLang() {
        return localStorage.getItem(STORAGE_KEY) || 'en';
      }

      function setTargetLang(lang) {
        localStorage.setItem(STORAGE_KEY, lang);
        langMenu.querySelectorAll('li').forEach(li => {
          li.classList.toggle('active', li.dataset.lang === lang);
        });
      }

      function getCsrfHeaders() {
        const tokenMeta = document.querySelector('meta[name="_csrf"]');
        const headerMeta = document.querySelector('meta[name="_csrf_header"]');
        const headers = { 'Content-Type': 'application/json' };
        if (tokenMeta && headerMeta) {
          headers[headerMeta.content] = tokenMeta.content;
        }
        return headers;
      }

      function isIgnoredTarget(el) {
        return !!el.closest('input, textarea, select, [contenteditable="true"], .dt-popup, .dt-trigger-btn, .dt-lang-widget');
      }

      function hideTrigger() {
        triggerBtn.style.display = 'none';
      }

      function hidePopup() {
        popup.hidden = true;
      }

      document.addEventListener('mouseup', (e) => {
        if (isIgnoredTarget(e.target)) return;

        const selection = window.getSelection();
        const text = selection ? selection.toString().trim() : '';

        if (!text || text.length < 1 || text.length > 300) {
          hideTrigger();
          return;
        }

        currentSelectionText = text;
        currentRange = selection.getRangeAt(0).cloneRange();

        const rect = currentRange.getBoundingClientRect();
        triggerBtn.style.display = 'flex';
        triggerBtn.style.top = `${window.scrollY + rect.bottom + 6}px`;
        triggerBtn.style.left = `${window.scrollX + rect.left}px`;
      });

      // 다른 곳 클릭하면 트리거 버튼 숨김 (팝업/버튼 자체 클릭은 예외)
      document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.dt-trigger-btn')) {
          hideTrigger();
        }
      });

      triggerBtn.addEventListener('click', async () => {
        if (!currentSelectionText) return;

        const rect = currentRange.getBoundingClientRect();
        popup.hidden = false;
        popup.style.top = `${window.scrollY + rect.bottom + 10}px`;
        popup.style.left = `${window.scrollX + rect.left}px`;

        originalEl.textContent = currentSelectionText;
        resultEl.innerHTML = '<span class="dt-loading">번역 중...</span>';
        hideTrigger();

        try {
          const res = await fetch('/api/translate', {
            method: 'POST',
            headers: getCsrfHeaders(),
            body: JSON.stringify({
              text: currentSelectionText,
              targetLang: getTargetLang()
            })
          });

          if (!res.ok) throw new Error('translate failed');

          const data = await res.json();
          resultEl.textContent = data.translatedText || '번역 결과가 없어요.';
        } catch (err) {
          resultEl.textContent = '번역에 실패했어요. 잠시 후 다시 시도해주세요.';
        }
      });

      closeBtn.addEventListener('click', hidePopup);

      langToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (dragMoved) { dragMoved = false; return; }
        langMenu.hidden = !langMenu.hidden;
      });

      langMenu.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => {
          setTargetLang(li.dataset.lang);
          langMenu.hidden = true;
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.dt-lang-widget')) {
          langMenu.hidden = true;
        }
      });

      // 초기 언어 표시 동기화
      setTargetLang(getTargetLang());

      // ── 언어 위젯 드래그 이동 ──
      const widget = document.getElementById('dtLangWidget');
      const DRAG_POS_KEY = 'kkyd_translate_widget_pos';
      const DRAG_THRESHOLD = 4;

      let dragging = false;
      let dragMoved = false;
      let pointerId = null;
      let startX = 0, startY = 0;
      let widgetStartLeft = 0, widgetStartTop = 0;

      function clampToViewport(left, top) {
        const rect = widget.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width - 4;
        const maxTop = window.innerHeight - rect.height - 4;

        // 네비바(고정 헤더) 뒤로 위젯이 들어가지 않도록, 네비바 높이만큼 위쪽 최소 여백을 확보
        const navbarEl = document.querySelector('.navbar');
        const minTop = (navbarEl ? navbarEl.offsetHeight : 64) + 8;

        return {
          left: Math.min(Math.max(4, left), Math.max(4, maxLeft)),
          top: Math.min(Math.max(minTop, top), Math.max(minTop, maxTop))
        };
      }

      function pinWidget(left, top) {
        widget.style.left = `${left}px`;
        widget.style.top = `${top}px`;
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';
      }

      function applyStoredPosition() {
        const saved = localStorage.getItem(DRAG_POS_KEY);
        if (!saved) return;
        try {
          const { left, top } = JSON.parse(saved);
          const clamped = clampToViewport(left, top);
          pinWidget(clamped.left, clamped.top);
        } catch (e) { /* 저장된 값이 이상하면 기본 위치 유지 */ }
      }

      langToggle.addEventListener('pointerdown', (e) => {
        dragging = true;
        dragMoved = false;
        pointerId = e.pointerId;
        const rect = widget.getBoundingClientRect();
        widgetStartLeft = rect.left;
        widgetStartTop = rect.top;
        startX = e.clientX;
        startY = e.clientY;
        langToggle.setPointerCapture(pointerId);
      });

      langToggle.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!dragMoved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
          dragMoved = true;
          widget.classList.add('dt-dragging');
          langMenu.hidden = true;
        }
        if (!dragMoved) return;
        const clamped = clampToViewport(widgetStartLeft + dx, widgetStartTop + dy);
        pinWidget(clamped.left, clamped.top);
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        widget.classList.remove('dt-dragging');
        if (dragMoved) {
          const rect = widget.getBoundingClientRect();
          localStorage.setItem(DRAG_POS_KEY, JSON.stringify({ left: rect.left, top: rect.top }));
        }
      }

      langToggle.addEventListener('pointerup', endDrag);
      langToggle.addEventListener('pointercancel', endDrag);

      // 화면 크기 바뀔 때 위젯이 화면 밖으로 나가지 않게 보정
      window.addEventListener('resize', () => {
        const rect = widget.getBoundingClientRect();
        const clamped = clampToViewport(rect.left, rect.top);
        if (clamped.left !== rect.left || clamped.top !== rect.top) {
          pinWidget(clamped.left, clamped.top);
        }
      });

      applyStoredPosition();
    })();
  </script>
</div>

<!--
  최초 1회 온보딩 안내: "드래그하면 번역 버튼이 떠요"
  실제 동작 순서(드래그 → 번역 버튼 → 클릭 → 팝업)에 맞춘 문구.
  dragTranslate fragment와 함께 삽입해야 함 (위 사용법 참고).
-->
<div th:fragment="dragTranslateOnboarding">
  <style>
    .dt-onboarding {
      position: fixed;
      inset: 0;
      background: rgba(15, 30, 50, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .dt-onboarding.show {
      opacity: 1;
      pointer-events: auto;
    }
    .dt-onboarding__card {
      max-width: 340px;
      width: calc(100% - 48px);
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(159,225,203,0.35));
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(24, 95, 165, 0.25);
      font-family: 'Noto Sans KR', sans-serif;
      transform: translateY(10px);
      transition: transform 0.25s ease;
    }
    .dt-onboarding.show .dt-onboarding__card {
      transform: translateY(0);
    }
    .dt-onboarding__emoji { font-size: 40px; margin-bottom: 8px; }
    .dt-onboarding__title {
      font-weight: 700;
      font-size: 17px;
      color: #185FA5;
      margin-bottom: 8px;
    }
    .dt-onboarding__desc {
      font-size: 14px;
      color: #33495e;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .dt-onboarding__desc strong { color: #5DCAA5; }
    .dt-onboarding__subdesc {
      font-size: 12.5px;
      color: #7a8ba0;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .dt-onboarding__btn {
      background: linear-gradient(135deg, #5DCAA5, #185FA5);
      color: #fff;
      border: none;
      padding: 10px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .dt-onboarding__btn:hover { opacity: 0.9; }
    .dt-onboarding__snooze {
      display: block;
      margin: 12px auto 0;
      background: none;
      border: none;
      color: #324963;
      font-size: 12.5px;
      text-decoration: underline;
      cursor: pointer;
      font-family: inherit;
    }
    .dt-onboarding__snooze:hover { color: #5a6a80; }
  </style>

  <div class="dt-onboarding" id="dtOnboarding">
    <div class="dt-onboarding__card">
      <div class="dt-onboarding__emoji">👆</div>
      <div class="dt-onboarding__title">Try dragging the text</div>
      <div class="dt-onboarding__desc">
        Select any sentence with your <strong>mouse</strong> and<br />
        a "Translate" button will appear!
      </div>
      <div class="dt-onboarding__subdesc">
        You can change the target language with the 🌐 button in the bottom right
      </div>
      <button class="dt-onboarding__btn" id="dtOnboardingClose" type="button">Got it</button>
      <button class="dt-onboarding__snooze" id="dtOnboardingSnooze" type="button">Don't show for 4 hours</button>
    </div>
  </div>

  <script th:inline="javascript">
    (function () {
      // 사이트 언어가 한국어일 때만 노출 (영어로 전환된 상태면 안 뜸)
      // - 페이지 처음 로드될 때 한국어 상태면 1번 노출
      // - 이후 언어 토글을 눌러서 한국어로 "바뀔 때마다" 매번 다시 노출
      //   (lang-toggle.js가 언어 바뀔 때 쏘는 kkyeoklangchange 이벤트를 구독)
      const SITE_LANG_KEY = 'kkyeok_lang';
      const SNOOZE_KEY = 'kkyd_dt_onboarding_snooze_until';
      const SNOOZE_HOURS = 4;
      const overlay = document.getElementById('dtOnboarding');
      const closeBtn = document.getElementById('dtOnboardingClose');
      const snoozeBtn = document.getElementById('dtOnboardingSnooze');
      if (!overlay) return;

      function isSnoozed() {
        const until = parseInt(localStorage.getItem(SNOOZE_KEY) || '0', 10);
        return Date.now() < until;
      }

      function showOnboarding(delay) {
        if (isSnoozed()) return;
        setTimeout(() => overlay.classList.add('show'), delay);
      }

      function closeOnboarding() {
        overlay.classList.remove('show');
      }

      function snoozeOnboarding() {
        localStorage.setItem(SNOOZE_KEY, String(Date.now() + SNOOZE_HOURS * 60 * 60 * 1000));
        closeOnboarding();
      }

      // 최초 페이지 로드 시: 한국어 상태면 노출 (단, 스누즈 중이면 안 뜸)
      const initialLang = localStorage.getItem(SITE_LANG_KEY) || 'ko';
      if (initialLang !== 'en') {
        showOnboarding(600);
      }

      // 언어 토글을 눌러서 한국어로 바뀔 때마다 다시 노출 (단, 스누즈 중이면 안 뜸)
      document.addEventListener('kkyeoklangchange', (e) => {
        if (e.detail && e.detail.lang !== 'en') {
          showOnboarding(300);
        } else {
          closeOnboarding();
        }
      });

      closeBtn.addEventListener('click', closeOnboarding);
      snoozeBtn.addEventListener('click', snoozeOnboarding);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeOnboarding();
      });
    })();
  </script>
</div>

</body>
</html>
