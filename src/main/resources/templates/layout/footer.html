<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  ================================
  사용법 (다른 페이지에서 삽입):
  <div th:replace="~{layout/footer :: footer}"></div>
  ================================
-->

<!-- 공용 내부 콘텐츠 (파라미터 유무와 상관없이 재사용) -->
<div th:fragment="footerBody" class="footer-inner">

  <!-- 상단: 로고 + 링크 -->
  <div class="footer-top">

    <!-- 브랜드 -->
    <div class="footer-brand">
      <a class="footer-logo" th:href="@{/}">
        <img th:src="@{/images/logo-white.png}" alt="끼역띠귿" class="footer-logo-img footer-logo-img-default" />
        <img th:src="@{/images/logo-admin.png}" alt="끼역띠귿" class="footer-logo-img footer-logo-img-admin" />
        <img th:src="@{/images/logo-gold.png}" alt="끼역띠귿" class="footer-logo-img footer-logo-img-game" />
      </a>
      <p class="footer-tagline">외국인과 다문화 가족을 위한<br>한국어 학습 플랫폼</p>
      <div class="footer-sns">
        <a th:href="@{/}" class="sns-btn" aria-label="인스타그램">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a th:href="@{/}" class="sns-btn" aria-label="유튜브">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M22.5 6.5a2.83 2.83 0 0 0-2-2C18.9 4 12 4 12 4s-6.9 0-8.5.5a2.83 2.83 0 0 0-2 2C1 8.1 1 12 1 12s0 3.9.5 5.5a2.83 2.83 0 0 0 2 2C5.1 20 12 20 12 20s6.9 0 8.5-.5a2.83 2.83 0 0 0 2-2C23 15.9 23 12 23 12s0-3.9-.5-5.5z"/>
            <polygon points="10 15.5 16 12 10 8.5 10 15.5" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- 링크 컬럼들 -->
    <div class="footer-links">

      <div class="footer-col">
        <h4>학습</h4>
        <ul>
          <li><a th:href="@{/category/list}">동영상 강의</a></li>
          <li><a th:href="@{/game}">학습 게임</a></li>
          <li><a th:href="@{/pricing}">구독 안내</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>커뮤니티</h4>
        <ul>
          <li><a th:href="@{/notice/list}">공지사항</a></li>
          <li><a th:href="@{/community}">커뮤니티</a></li>
          <li><a th:href="@{/faq/list}">자주 묻는 질문</a></li>
          <li><a th:href="@{/qna/write}">1:1 질문하기</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>고객지원</h4>
        <ul>
          <li><a th:href="@{/terms}">이용약관</a></li>
          <li><a th:href="@{/privacy}">개인정보처리방침</a></li>
          <li><a th:href="@{/siteUser/mypage}">마이페이지</a></li>
        </ul>
      </div>

    </div>
  </div>

  <!-- 구분선 -->
  <div class="footer-divider"></div>

  <!-- 하단: 카피라이트 -->
  <div class="footer-bottom">
    <p class="copyright">© 2026 끼역띠귿. All rights reserved.</p>
    <p class="footer-info">사업자등록번호 123-45-67890 &nbsp;|&nbsp; 대표자 봄글 &nbsp;|&nbsp; 이메일 help@kkiyeok.com</p>
  </div>

</div>

<!-- 기존 페이지들이 쓰는 무인자 버전 (그대로 유지, 절대 안 건드림) -->
<footer th:fragment="footer" class="site-footer"
        th:classappend="${#authorization.expression('hasRole(''ADMIN'') or authentication.name == ''admin888''')} ? 'footer-admin'">
  <link th:href="@{/css/layout/footer.css}" rel="stylesheet" />
  <div th:replace="~{layout/footer :: footerBody}"></div>
</footer>

<!-- 게임 페이지 등 테마 지정이 필요한 곳에서 쓰는, 이름이 다른 별도 프래그먼트
     (주의: 태그를 <footer>로 하면 위 th:fragment="footer"와 "태그 이름"으로 매칭이 겹쳐서
     ~{layout/footer :: footer} 호출 시 둘 다 렌더링되는 버그가 생김. 그래서 일부러 <div>로 씀) -->
<div th:fragment="footerThemed(theme)" class="site-footer"
     th:classappend="${(#authorization.expression('hasRole(''ADMIN'') or authentication.name == ''admin888''') ? 'footer-admin ' : '') + (theme == 'game' ? 'footer-game' : '')}"
     role="contentinfo">
  <link th:href="@{/css/layout/footer.css}" rel="stylesheet" />
  <div th:replace="~{layout/footer :: footerBody}"></div>
</div>

</body>
</html>
