<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="'끼역띠귿 — ' + ${content.title}">끼역띠귿</title>
    <link rel="stylesheet" th:href="@{/css/layout/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/layout/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/content/view.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

</head>
<body>

<div class="bg-orbs"><div class="orb o1"></div><div class="orb o2"></div></div>

<!-- NAV -->
<div th:replace="~{layout/navbar :: navbar(currentMenu='lectures')}"></div>


<!-- 브레드크럼 -->
<div class="breadcrumb">
    <a th:href="@{/category/list}">강의 목록</a>
    <span>›</span>
    <a th:href="@{/category/view/{id}(id=${content.category.id})}" th:text="${content.category.title}">단계</a>
    <span>›</span>
    <span style="color:var(--ink);" th:text="${content.sequence} + '강 ' + ${content.title}">강의 제목</span>
</div>

<!-- 메인 -->
<div class="main">

    <!-- 왼쪽 플레이어 -->
    <div class="player-col">

        <!-- 플레이어 -->
        <div class="player-wrap">
            <div class="player-screen">
                <video id="videoPlayer"
                       th:src="@{/content/stream/{id}(id=${content.id})}"
                       style="width:100%;height:100%;object-fit:contain;background:#000;"
                       playsinline>
                </video>
                <div class="player-overlay" id="playerOverlay">
                    <div class="play-circle">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
            </div>
            <div class="player-bar">
                <div class="progress-track">
                    <div class="progress-current"></div>
                </div>
                <div class="bar-controls">
                    <div class="bar-left">
                        <button class="ctrl-btn" aria-label="이전 강의">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                        </button>
                        <button class="ctrl-btn play" aria-label="재생/일시정지" id="playPauseIcon">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="ctrl-btn" aria-label="다음 강의">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
                        </button>
                        <span class="time-display">00:00 / 00:00</span>
                    </div>
                    <div class="bar-right">
                        <button class="speed-btn">1.0x</button>
                        <button class="ctrl-btn" aria-label="전체화면">
                            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 강의 정보 -->
        <div class="lecture-info">
            <div class="li-top">
                <div>
                    <div class="li-badge" th:text="${content.category.title}">단계 · 단어 월드</div>
                    <div class="li-title" th:text="${content.sequence} + '강 — ' + ${content.title}">강의 제목</div>
                </div>
                <div class="li-actions">
                    <button class="li-btn">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
                        </svg>저장
                    </button>
                    <button class="li-btn">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
                        </svg>메모
                    </button>
                </div>
            </div>
            <div class="li-meta">
                <span style="display:inline-flex;align-items:center;gap:5px;">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M8.5 12.2l2.2 2.2 4.8-4.8"/>
                    </svg>
                    <span th:text="${content.progressPercent} == 100 ? '완료' : ${content.progressPercent} + '% 진행 중'">진행 상태</span>
                </span>
            </div>
        </div>

        <!-- 강의 설명 -->
        <div class="lecture-desc">
            <div class="desc-title" style="display:flex;align-items:center;gap:6px;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 5.5c0-.83.67-1.5 1.5-1.5H11a1 1 0 0 1 1 1v14a1 1 0 0 0-1-1H5.5A1.5 1.5 0 0 0 4 19.5v-14z"/>
                    <path d="M20 5.5c0-.83-.67-1.5-1.5-1.5H13a1 1 0 0 0-1 1v14a1 1 0 0 1 1-1h5.5a1.5 1.5 0 0 1 1.5 1.5v-14z"/>
                </svg>강의 소개
            </div>
            <div class="desc-text" th:text="${content.description}">
                강의 설명이 여기 표시됩니다.
            </div>
            <div class="keyword-list" th:if="${content.keywords != null and !content.keywords.isEmpty()}">
                <span class="keyword" th:each="kw : ${#strings.arraySplit(content.keywords, ',')}" th:text="${#strings.trim(kw)}">키워드</span>
            </div>
        </div>

    </div>

    <!-- 오른쪽 사이드바 -->
    <div class="sidebar">

        <!-- 강의 목록 -->
        <div class="sidebar-card">
            <div class="sidebar-header">
                <span th:text="${content.category.title} + ' 강의 목록'">강의 목록</span>
                <span th:text="${#lists.size(contentList)} + '강'">0강</span>
            </div>

            <a th:each="c : ${contentList}"
               th:with="cUnlocked=(${isPaid} or ${c.free})"
               th:href="${cUnlocked} ? @{/content/view/{id}(id=${c.id})} : @{/orderPay/list(categoryId=${content.category.id})}"
               th:classappend="${c.id == content.id} ? 'active' : ''"
               style="text-decoration:none;color:inherit;display:flex;">
                <div class="sl-item" th:classappend="${c.id == content.id} ? 'active' : ''" style="width:100%;">
                    <div class="sl-thumb" th:unless="${c.thumbFileName != null and !c.thumbFileName.isEmpty()}" style="background:linear-gradient(135deg,#c8f0e2,#b5d4f4);">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 5.5c0-.83.67-1.5 1.5-1.5H11a1 1 0 0 1 1 1v14a1 1 0 0 0-1-1H5.5A1.5 1.5 0 0 0 4 19.5v-14z"/>
                            <path d="M20 5.5c0-.83-.67-1.5-1.5-1.5H13a1 1 0 0 0-1 1v14a1 1 0 0 1 1-1h5.5a1.5 1.5 0 0 1 1.5 1.5v-14z"/>
                        </svg>
                        <div class="sl-done-mark" th:if="${cUnlocked and c.progressPercent == 100}">
                            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
                        </div>
                        <div class="sl-lock" th:unless="${cUnlocked}">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="11" width="14" height="9" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                        </div>
                    </div>
                    <div class="sl-thumb" th:if="${c.thumbFileName != null and !c.thumbFileName.isEmpty()}"
                         th:style="'background-image:url(' + @{${c.thumbFileName}} + ');background-size:cover;background-position:center;'">
                        <div class="sl-done-mark" th:if="${cUnlocked and c.progressPercent == 100}">
                            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
                        </div>
                        <div class="sl-lock" th:unless="${cUnlocked}">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="11" width="14" height="9" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                        </div>
                    </div>
                    <div class="sl-info">
                        <div class="sl-num" th:text="${c.sequence} + '강'">1강</div>
                        <div class="sl-title" th:text="${c.title}">강의 제목</div>
                        <div class="sl-time"
                             th:if="${cUnlocked}"
                             th:text="${c.progressPercent} == 100 ? '완료' : (${c.progressPercent} > 0 ? '진행 중 ' + ${c.progressPercent} + '%' : '미시청')">
                        </div>
                        <div class="sl-time sl-time-locked" th:unless="${cUnlocked}">
                            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="11" width="14" height="9" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                            잠김
                        </div>
                    </div>
                </div>
            </a>

        </div>

        <!-- 퀴즈 (컴팩트) -->
        <div class="sidebar-card" style="position:relative;" id="quiz-card" th:if="${quizId != null}">
            <!-- 잠금 오버레이 -->
            <div class="quiz-locked-overlay" id="quiz-locked-overlay" th:style="${quizUnlocked} ? 'display:none;' : ''">
                <div class="quiz-lock-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="11" width="14" height="9" rx="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                    </svg>
                </div>
                <div class="quiz-lock-title">강의를 완료하면 퀴즈가 열려요!</div>
                <div class="quiz-lock-desc">영상을 끝까지 시청하고<br/>실력을 확인해보세요
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="vertical-align:-1px;">
                        <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/>
                    </svg>
                </div>
                <div class="quiz-lock-bar-wrap" style="margin-top:4px;">
                    <div class="quiz-lock-bar" id="quiz-lock-bar" th:style="'width:' + ${content.progressPercent} + '%;'"></div>
                </div>
                <div style="font-size:11px;color:var(--ink-faint);margin-top:2px;" id="quiz-lock-pct" th:text="${content.progressPercent} + '% 시청'">0% 시청</div>
            </div>

            <div class="sidebar-header" style="display:flex;align-items:center;gap:6px;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2.5"/>
                    <path d="M7 9h10M7 13h6"/>
                </svg>
                퀴즈 <span id="quiz-count">불러오는 중…</span>
            </div>

            <div style="padding:16px;">

                <!-- 진행 바 -->
                <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:14px;">
                    <div id="qp-fill" style="height:100%;width:0%;background:linear-gradient(90deg,var(--mint-dark),var(--mint));border-radius:2px;transition:width .3s;"></div>
                </div>

                <!-- 문제 -->
                <div id="quiz-main">
                    <div id="quiz-question" style="font-size:13px;font-weight:700;color:var(--ink);line-height:1.55;margin-bottom:12px;">
                        퀴즈를 준비하고 있어요…
                    </div>

                    <div id="quiz-options" style="display:flex;flex-direction:column;gap:7px;margin-bottom:12px;"></div>

                    <div id="quiz-feedback" style="display:none;font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:10px;line-height:1.55;"></div>

                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                        <button onclick="skipQuestion()" style="font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--ink-faint);cursor:pointer;font-family:inherit;">건너뛰기</button>
                        <div style="display:flex;gap:7px;">
                            <button id="qbtn-submit" onclick="submitAnswer()" disabled
                                    style="font-size:12px;padding:7px 16px;border-radius:8px;border:none;background:var(--mint);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;opacity:0.5;">확인</button>
                            <button id="qbtn-next" onclick="nextQuestion()"
                                    style="display:none;font-size:12px;padding:7px 16px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;">다음 →</button>
                        </div>
                    </div>
                </div>

                <!-- 결과 -->
                <div id="quiz-result" style="display:none;text-align:center;padding:12px 0;">
                    <div id="result-emoji" style="margin-bottom:8px;color:var(--mint-dark);display:flex;justify-content:center;">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/>
                            <path d="M7 5H4a2 2 0 0 0 2 4M17 5h3a2 2 0 0 1-2 4"/>
                        </svg>
                    </div>
                    <div id="result-score" style="font-size:26px;font-weight:700;color:var(--mint-dark);letter-spacing:-0.5px;margin-bottom:4px;"></div>
                    <div id="result-label" style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;"></div>
                    <button onclick="resetQuiz()" style="padding:8px 20px;border-radius:8px;background:var(--mint-pale);color:var(--mint-dark);border:1px solid rgba(93,202,165,.3);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-2.6-6.35M21 4v5h-5"/>
                        </svg>다시 풀기
                    </button>
                </div>

                <!-- 점수 -->
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:12px;color:var(--ink-faint);">현재 점수</span>
                    <span id="quiz-score-badge" style="font-size:13px;font-weight:700;color:var(--navy);">0점</span>
                </div>

            </div>
        </div>

    </div>
</div>

<!-- 띠귿이 AI 튜터 플로팅 버튼 -->
<button id="ddigeudToggleBtn" class="ddigeud-toggle-btn" aria-label="AI 튜터 띠귿이 열기">
    <span class="ddigeud-toggle-emoji">🦉</span>
    <span class="ddigeud-toggle-label">띠귿이</span>
</button>

<!-- 띠귿이 AI 튜터 패널 -->
<div id="ddigeudPanel" class="ddigeud-panel">
    <div class="ddigeud-header">
        <div class="ddigeud-header-title">
            <span class="ddigeud-avatar">🦉</span>
            <span>띠귿이</span>
        </div>
        <div class="ddigeud-header-right">
            <select id="ddigeudLangSelect" class="ddigeud-lang-select" aria-label="번역 언어 선택">
                <option value="">번역 안 함</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
                <option value="vi">Tiếng Việt</option>
                <option value="tl">Filipino</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="th">ไทย</option>
            </select>
            <button id="ddigeudCloseBtn" class="ddigeud-close-btn" aria-label="닫기">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <div id="ddigeudMessages" class="ddigeud-messages">
        <div class="ddigeud-msg ddigeud-msg-bot">
            안녕하세요, 저는 띠귿이예요. 이 강의 내용에 대해 궁금한 점을 물어보세요.
        </div>
    </div>

    <div class="ddigeud-input-row">
        <input id="ddigeudInput" type="text" class="ddigeud-input" placeholder="강의 내용에 대해 물어보세요…" />
        <button id="ddigeudMicBtn" class="ddigeud-mic-btn" aria-label="음성으로 질문하기">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v3"/>
            </svg>
        </button>
        <button id="ddigeudSendBtn" class="ddigeud-send-btn" aria-label="전송">↑</button>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/drag-translate :: dragTranslate}"></div>
<script th:src="@{/js/drag-widget.js}"></script>
<script th:inline="javascript">
    // 서버에서 받은 텍스트(explanation 등)를 innerHTML에 안전하게 넣기 위한 이스케이프 헬퍼
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    // ── 속도 버튼 ──
    const speeds = ['0.75x','1.0x','1.25x','1.5x','2.0x'];
    let si = 1;
    document.querySelector('.speed-btn').addEventListener('click', function() {
      si = (si + 1) % speeds.length;
      this.textContent = speeds[si];
    });

    // ── 실제 video 연동 ──
    const video        = document.getElementById('videoPlayer');
    const overlay       = document.getElementById('playerOverlay');
    const progressBar   = document.querySelector('.progress-current');
    const progressTrack = document.querySelector('.progress-track');
    const lockBar       = document.getElementById('quiz-lock-bar');
    const lockPct       = document.getElementById('quiz-lock-pct');
    const lockOverlay   = document.getElementById('quiz-locked-overlay');
    const playBtn       = document.querySelector('.ctrl-btn.play');
    const timeDisplay   = document.querySelector('.time-display');

    const contentId  = /*[[${content.id}]]*/ 0;
    const savedTime  = /*[[${savedTime}]]*/ 0;
    const quizId     = /*[[${quizId}]]*/ null;
    const quizUnlockedInitial = /*[[${quizUnlocked}]]*/ false;
    const csrfToken  = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    let completedFired = false;
    let maxWatchedTime = 0; // 실제로 시청한 최대 지점 (이 지점보다 앞으로는 못 건너뛰게 막기 위함)

    function secToStr(s) {
      if (!isFinite(s) || s < 0) s = 0;
      const m = Math.floor(s / 60), sec = Math.floor(s % 60);
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function updateProgressUI(pct) {
      progressBar.style.width = pct + '%';
      if (lockBar) lockBar.style.width = pct + '%';
      if (lockPct) lockPct.textContent = Math.round(pct) + '% 시청';
      timeDisplay.textContent = `${secToStr(video.currentTime)} / ${secToStr(video.duration)}`;
    }

    let quizLoaded = false;

    function unlockQuiz() {
      if (!quizId) return;
      if (lockOverlay) {
        lockOverlay.style.transition = 'opacity .5s';
        lockOverlay.style.opacity = '0';
        setTimeout(() => { lockOverlay.style.display = 'none'; }, 500);
      }
      if (!quizLoaded) loadQuiz();
    }

    // 재생 시작 위치 복원 (이어보기)
    video.addEventListener('loadedmetadata', function () {
      if (savedTime > 0 && savedTime < video.duration) {
        video.currentTime = savedTime;
        maxWatchedTime = savedTime;
      }
      updateProgressUI(video.duration > 0 ? (video.currentTime / video.duration * 100) : 0);
    });

    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    video.addEventListener('play', function () {
      playBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
      overlay.style.display = 'none';
    });

    video.addEventListener('pause', function () {
      playBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      overlay.style.display = 'flex';
    });

    // 서버에 진행률 저장 (너무 자주 보내지 않도록 3초에 한 번)
    let lastSent = 0;
    video.addEventListener('timeupdate', function () {
      if (!video.duration) return;

      // 정상 재생으로 도달한 지점까지만 "시청한 지점"으로 인정 (되감기 후 다시 보는 건 갱신 안 함)
      if (video.currentTime > maxWatchedTime) {
        maxWatchedTime = video.currentTime;
      }

      const pct = (video.currentTime / video.duration) * 100;
      updateProgressUI(pct);
      if (pct >= 100) unlockQuiz();

      const now = Date.now();
      if (now - lastSent > 3000) {
        lastSent = now;
        sendProgress(pct, video.currentTime);
      }
    });

    video.addEventListener('ended', function () {
      updateProgressUI(100);
      unlockQuiz();
      sendProgress(100, video.duration);
      if (!completedFired) {
        completedFired = true;
        markComplete();
      }
    });

    function sendProgress(percentage, time) {
      const headers = { 'Content-Type': 'application/json' };
      if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

      fetch('/content/progress/' + contentId, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ percentage: percentage, lastWatchedTime: time })
      }).catch(function () { /* 네트워크 오류는 조용히 무시, 다음 timeupdate 때 재시도됨 */ });
    }

    function markComplete() {
      const headers = { 'Content-Type': 'application/json' };
      if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

      fetch('/content/complete/' + contentId, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({})
      }).catch(function () {});
    }

    // 진행 바 클릭으로 탐색 (되감기는 자유롭게, 안 본 구간으로 건너뛰기는 막음)
    progressTrack.addEventListener('click', function (e) {
      if (!video.duration) return;
      const rect = this.getBoundingClientRect();
      const pct  = Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100));
      const targetTime = video.duration * (pct / 100);
      video.currentTime = Math.min(targetTime, maxWatchedTime);
    });

    // 혹시 다른 경로(모바일 제스처 등)로 탐색이 발생해도 안 본 구간으로는 못 넘어가게 이중 방어
    video.addEventListener('seeking', function () {
      if (video.currentTime > maxWatchedTime + 0.5) {
        video.currentTime = maxWatchedTime;
      }
    });

    // 재생 버튼 / 플레이어 화면 클릭
    document.querySelector('.player-screen').addEventListener('click', togglePlay);
    playBtn.addEventListener('click', function(e) { e.stopPropagation(); togglePlay(); });


    // ── 퀴즈 (실제 /api/quiz 연동) ──
    let quizQuestions = [];
    let currentQ = 0, selectedOptIdx = null, score = 0, answered = false;

    function apiHeaders(json) {
      const h = {};
      if (json) h['Content-Type'] = 'application/json';
      if (csrfHeader && csrfToken) h[csrfHeader] = csrfToken;
      return h;
    }

    function loadQuiz() {
      if (!quizId || quizLoaded) return;
      quizLoaded = true;
      document.getElementById('quiz-question').textContent = '퀴즈를 불러오는 중…';

      fetch('/api/quiz/' + quizId + '/start-embedded', { headers: apiHeaders(false) })
        .then(res => res.json())
        .then(data => {
          quizQuestions = data.questions || [];
          currentQ = 0; score = 0;
          if (quizQuestions.length === 0) {
            document.getElementById('quiz-question').textContent = '등록된 문항이 없어요.';
            return;
          }
          renderQuestion();
        })
        .catch(() => {
          document.getElementById('quiz-question').textContent = '퀴즈를 불러오지 못했어요. 새로고침해주세요.';
        });
    }

    // 이미 영상을 완료한 상태로 페이지에 들어온 경우 바로 로드
    if (quizId && quizUnlockedInitial) {
      loadQuiz();
    }

    document.addEventListener('click', function (e) {
      const opt = e.target.closest('.cq-opt');
      if (!opt || answered) return;
      document.querySelectorAll('#quiz-options .cq-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedOptIdx = parseInt(opt.dataset.idx, 10);
      const btn = document.getElementById('qbtn-submit');
      if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
    });

    function renderQuestion() {
      const q = quizQuestions[currentQ];
      const letters = ['A', 'B', 'C', 'D'];
      const options = q.options || [];

      document.getElementById('quiz-question').innerHTML =
        `<span style="display:inline-block;background:var(--mint);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;margin-right:5px;vertical-align:middle;">Q${currentQ + 1}</span>${q.question}`;

      document.getElementById('quiz-options').innerHTML = options.map((o, i) =>
        `<div class="cq-opt" data-idx="${i}"><span class="cq-letter">${letters[i]}</span><span>${o}</span></div>`
      ).join('');

      const fb = document.getElementById('quiz-feedback');
      fb.style.display = 'none'; fb.style.background = ''; fb.style.color = ''; fb.style.border = ''; fb.textContent = '';

      const submit = document.getElementById('qbtn-submit');
      submit.style.display = ''; submit.disabled = true; submit.style.opacity = '0.5';

      document.getElementById('qbtn-next').style.display = 'none';
      document.getElementById('qbtn-next').textContent = '다음 →';
      document.querySelector('[onclick="skipQuestion()"]').style.display = '';
      document.getElementById('quiz-count').textContent = `${currentQ + 1} / ${quizQuestions.length}`;
      document.getElementById('qp-fill').style.width = `${((currentQ + 1) / quizQuestions.length) * 100}%`;

      selectedOptIdx = null; answered = false;
    }

    function submitAnswer() {
      if (selectedOptIdx === null || answered) return;
      answered = true;
      const q = quizQuestions[currentQ];
      const opts = document.querySelectorAll('#quiz-options .cq-opt');
      const fb = document.getElementById('quiz-feedback');

      // 서버가 정답 여부/해설을 판정 (문항에는 정답이 안 내려오므로 서버 응답 기준으로 표시)
      fetch('/api/quiz/question/' + q.id + '/check', {
        method: 'POST',
        headers: apiHeaders(true),
        body: JSON.stringify({ selectedOption: selectedOptIdx + 1 }) // option1~4 → 1~4
      })
        .then(res => res.json())
        .then(result => {
          if (result.correct) {
            opts[selectedOptIdx].classList.remove('selected'); opts[selectedOptIdx].classList.add('correct');
            opts[selectedOptIdx].querySelector('.cq-letter').style.background = 'var(--mint-dark)';
            opts[selectedOptIdx].querySelector('.cq-letter').style.color = '#fff';
            fb.style.background = 'var(--mint-pale)'; fb.style.color = 'var(--mint-dark)';
            fb.style.border = '1px solid rgba(93,202,165,.3)';
            fb.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.2 2.2 4.8-4.8"/></svg>정답이에요! ' + escapeHtml(result.explanation || '');
            score++;
          } else {
            const correctIdx = (result.correctAnswer || 1) - 1;
            opts[selectedOptIdx].classList.remove('selected'); opts[selectedOptIdx].classList.add('wrong');
            opts[selectedOptIdx].querySelector('.cq-letter').style.background = '#EF4444';
            opts[selectedOptIdx].querySelector('.cq-letter').style.color = '#fff';
            if (opts[correctIdx]) {
              opts[correctIdx].classList.add('correct');
              opts[correctIdx].querySelector('.cq-letter').style.background = 'var(--mint-dark)';
              opts[correctIdx].querySelector('.cq-letter').style.color = '#fff';
            }
            fb.style.background = '#FEF2F2'; fb.style.color = '#EF4444';
            fb.style.border = '1px solid rgba(239,68,68,.2)';
            fb.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-2px;margin-right:4px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>아쉬워요. ' + escapeHtml(result.explanation || '');
          }

          fb.style.display = 'block';
          document.getElementById('qbtn-submit').style.display = 'none';
          document.getElementById('qbtn-next').style.display = '';
          document.querySelector('[onclick="skipQuestion()"]').style.display = 'none';
          document.getElementById('quiz-score-badge').textContent = `${score}점`;
          if (currentQ === quizQuestions.length - 1) document.getElementById('qbtn-next').textContent = '결과 보기 →';
        })
        .catch(() => {
          fb.style.display = 'block';
          fb.textContent = '채점 중 오류가 발생했어요. 다시 시도해주세요.';
          answered = false;
        });
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ >= quizQuestions.length) finishQuiz();
      else renderQuestion();
    }

    function skipQuestion() {
      if (answered) return;
      currentQ++;
      if (currentQ >= quizQuestions.length) finishQuiz();
      else renderQuestion();
    }

    function finishQuiz() {
      fetch('/api/quiz/' + quizId + '/finish', {
        method: 'POST',
        headers: apiHeaders(true),
        body: JSON.stringify({ score: score, total: quizQuestions.length })
      }).finally(showResult);
    }

    function showResult() {
      document.getElementById('quiz-main').style.display = 'none';
      document.getElementById('quiz-result').style.display = 'block';
      const pct = Math.round((score / quizQuestions.length) * 100);
      document.getElementById('result-score').textContent = `${score} / ${quizQuestions.length}`;
      document.getElementById('result-emoji').innerHTML = pct >= 75
        ? '<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a2 2 0 0 0 2 4M17 5h3a2 2 0 0 1-2 4"/></svg>'
        : pct >= 50
        ? '<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.2 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.2 6.1-.6z"/></svg>'
        : '<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.35M21 4v5h-5"/></svg>';
      document.getElementById('result-label').textContent =
        pct >= 75 ? '훌륭해요! 다음 강의로 넘어가볼까요?' :
        pct >= 50 ? '잘 하셨어요! 한 번 더 풀어볼까요?' : '조금 더 복습하고 다시 도전해봐요!';
      document.getElementById('quiz-score-badge').textContent = `최종: ${score}점`;
      document.getElementById('quiz-count').textContent = '완료!';
    }

    function resetQuiz() {
      quizLoaded = false;
      currentQ = 0; score = 0; selectedOptIdx = null; answered = false;
      document.getElementById('quiz-main').style.display = 'block';
      document.getElementById('quiz-result').style.display = 'none';
      document.getElementById('quiz-score-badge').textContent = '0점';
      loadQuiz();
    }

    // ── 띠귿이 AI 튜터 ──
    const ddigeudToggleBtn = document.getElementById('ddigeudToggleBtn');
    const ddigeudPanel      = document.getElementById('ddigeudPanel');
    const ddigeudCloseBtn   = document.getElementById('ddigeudCloseBtn');
    const ddigeudMessages   = document.getElementById('ddigeudMessages');
    const ddigeudInput      = document.getElementById('ddigeudInput');
    const ddigeudSendBtn    = document.getElementById('ddigeudSendBtn');

    const lectureTitleForTutor   = /*[[${content.sequence} + '강 ' + ${content.title}]]*/ '';
    const lectureContentForTutor = /*[[${content.description}]]*/ '';

    ddigeudToggleBtn.addEventListener('click', () => {
      ddigeudPanel.classList.toggle('open');
      if (ddigeudPanel.classList.contains('open')) ddigeudInput.focus();
    });
    ddigeudCloseBtn.addEventListener('click', () => ddigeudPanel.classList.remove('open'));

    function appendDdigeudMsg(text, type) {
      const div = document.createElement('div');
      div.className = 'ddigeud-msg ddigeud-msg-' + type;

      const textSpan = document.createElement('span');
      textSpan.textContent = text;
      div.appendChild(textSpan);

      if (type === 'bot') {
        const speakBtn = document.createElement('button');
        speakBtn.className = 'ddigeud-speak-btn';
        speakBtn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
        speakBtn.setAttribute('aria-label', '음성으로 듣기');
        speakBtn.addEventListener('click', () => speakDdigeud(text, speakBtn));
        div.appendChild(speakBtn);

        const translateBtn = document.createElement('button');
        translateBtn.className = 'ddigeud-translate-btn';
        translateBtn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a13 13 0 0 1 0 18M12 3a13 13 0 0 0 0 18"/></svg>';
        translateBtn.setAttribute('aria-label', '번역 보기');

        const translatedDiv = document.createElement('div');
        translatedDiv.className = 'ddigeud-translated';
        translatedDiv.style.display = 'none';

        translateBtn.addEventListener('click', () => translateDdigeud(text, translateBtn, translatedDiv));
        div.appendChild(translateBtn);
        div.appendChild(translatedDiv);
      }

      ddigeudMessages.appendChild(div);
      ddigeudMessages.scrollTop = ddigeudMessages.scrollHeight;
      return div;
    }

    // ── 띠귿이 번역 (구글 번역 API) ──
    function translateDdigeud(text, btnEl, targetDiv) {
      const langSelect = document.getElementById('ddigeudLangSelect');
      const targetLang = langSelect.value;

      if (!targetLang) {
        alert('상단에서 번역할 언어를 먼저 선택해주세요.');
        return;
      }

      // 이미 번역이 열려있으면 토글로 닫기만
      if (targetDiv.style.display !== 'none' && targetDiv.dataset.lang === targetLang) {
        targetDiv.style.display = 'none';
        return;
      }

      btnEl.disabled = true;
      targetDiv.style.display = 'block';
      targetDiv.textContent = '번역 중…';

      const headers = { 'Content-Type': 'application/json' };
      if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

      fetch('/api/translate', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ text: text, targetLang: targetLang })
      })
        .then(res => res.json())
        .then(data => {
          targetDiv.textContent = data.translatedText;
          targetDiv.dataset.lang = targetLang;
        })
        .catch(() => {
          targetDiv.textContent = '번역에 실패했어요.';
        })
        .finally(() => { btnEl.disabled = false; });
    }

    // ── 띠귿이 TTS (브라우저 내장 SpeechSynthesis) ──
    function speakDdigeud(text, btnEl) {
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저는 음성 읽기를 지원하지 않아요.');
        return;
      }
      window.speechSynthesis.cancel(); // 겹쳐 재생 방지

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 1.0;
      utter.pitch = 1.0;

      if (btnEl) {
        utter.onstart = () => { btnEl.classList.add('speaking'); };
        utter.onend   = () => { btnEl.classList.remove('speaking'); };
        utter.onerror = () => { btnEl.classList.remove('speaking'); };
      }

      window.speechSynthesis.speak(utter);
    }

    // ── 띠귿이 STT (브라우저 내장 SpeechRecognition) ──
    const ddigeudMicBtn = document.getElementById('ddigeudMicBtn');
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    let ddigeudRecognition = null;
    let ddigeudListening = false;

    if (SpeechRecognitionCtor) {
      ddigeudRecognition = new SpeechRecognitionCtor();
      ddigeudRecognition.lang = 'ko-KR';
      ddigeudRecognition.interimResults = false;
      ddigeudRecognition.maxAlternatives = 1;

      ddigeudRecognition.onstart = () => {
        ddigeudListening = true;
        ddigeudMicBtn.classList.add('listening');
      };

      ddigeudRecognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        ddigeudInput.value = transcript;
      };

      ddigeudRecognition.onerror = () => {
        ddigeudListening = false;
        ddigeudMicBtn.classList.remove('listening');
      };

      ddigeudRecognition.onend = () => {
        ddigeudListening = false;
        ddigeudMicBtn.classList.remove('listening');
      };

      ddigeudMicBtn.addEventListener('click', () => {
        if (ddigeudListening) {
          ddigeudRecognition.stop();
        } else {
          window.speechSynthesis.cancel(); // 띠귿이 말하는 중이면 멈추고 듣기 시작
          ddigeudRecognition.start();
        }
      });
    } else {
      ddigeudMicBtn.style.display = 'none'; // 미지원 브라우저는 마이크 버튼 숨김
    }

    function sendToDdigeud() {
      const question = ddigeudInput.value.trim();
      if (!question) return;

      appendDdigeudMsg(question, 'user');
      ddigeudInput.value = '';
      ddigeudSendBtn.disabled = true;

      const loadingMsg = appendDdigeudMsg('생각하고 있어요…', 'loading');

      const headers = { 'Content-Type': 'application/json' };
      if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

      fetch('/api/ai-tutor', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          question: question,
          lectureTitle: lectureTitleForTutor,
          lectureContent: lectureContentForTutor,
          videoTimestamp: Math.floor(video.currentTime || 0)
        })
      })
        .then(res => res.json())
        .then(data => {
          loadingMsg.remove();
          appendDdigeudMsg(data.reply, 'bot');
        })
        .catch(() => {
          loadingMsg.remove();
          appendDdigeudMsg('답변을 가져오지 못했어요. 다시 시도해주세요.', 'bot');
        })
        .finally(() => { ddigeudSendBtn.disabled = false; });
    }

    ddigeudSendBtn.addEventListener('click', sendToDdigeud);
    ddigeudInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendToDdigeud();
    });

</script>

</body>
